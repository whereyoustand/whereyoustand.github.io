 0.5, 0.8, -0.6, -0.5, -0.6, -0.5, -0.5]}, {"id": "jp_showa", "f": "milit", "n": "Militarist Japan under Shōwa", "p": "1931–1945", "pl": "Japan", "s": "“eight corners of the world under one roof”; “the national polity”", "sc": "militarist mobilization regime", "note": "The military sidelined the cabinet; the 1940 Imperial Rule Assistance Association abolished parties. State Shinto and a total mobilization system.", "kn": "", "v": [0.5, -1.0, -0.8, -0.7, 0.8, -0.9, -0.9, -0.9, -0.9, -0.8, 0.8, -0.9, 0.7, 0.8, -0.8, -0.5, -1.0, 0.8, 0.9, -0.8, -0.8, -0.9, -1.0, 1.0]}, {"id": "gr_athens", "f": "rep", "n": "Athenian democracy", "p": "508–322 BCE", "pl": "Ancient Greece", "s": "“demokratia” (rule of the people)", "sc": "direct democracy / sortition", "note": "The assembly (Ekklesia) had a quorum of about six thousand; the council of five hundred was chosen by lot; most offices were filled by lot rather than election. Ostracism. Citizenship was extremely narrow: slaves, women and resident foreigners (metoikoi) had no political rights.", "kn": "The difference from modern liberal democracy is not institutions but who counts as a person: citizens were a minority, and their freedom was freedom to rule, not freedom from interference (Constant's distinction, 1819).", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.5, 0.8, 0.5, 0.8, -0.5, 0.9, -0.5, -0.5, 0.8, 0.5, -0.8, 0.5, 0.5, 0.5, 0, 0.8, 0.9, -0.8]}, {"id": "rm_republic", "f": "rep", "n": "The Roman Republic", "p": "509–27 BCE", "pl": "Ancient Rome", "s": "“SPQR” (the Senate and People of Rome)", "sc": "mixed constitution (Polybius)", "note": "Consuls (elected), a life-long Senate, tribunes (sacrosanct), and the centuriate assembly. Polybius held the three to check one another and called it the best constitution; the argument later fed Montesquieu.", "kn": "Same shape as Athens, but it is an oligarchic republic — the Senate leads, and the plebs have a veto (the tribunes) without a right of initiative.", "v": [0.5, -0.8, -0.5, -0.5, 0, -0.5, 0.5, 0.5, 0.5, 0.5, -0.8, 0.6, -0.5, -0.5, -0.5, 0.8, -0.8, 0.5, 0.5, 0.5, 0, 0.6, 0.6, -0.5]}, {"id": "pl_commonwealth", "f": "rep", "n": "The Polish–Lithuanian Commonwealth", "p": "1569–1795", "pl": "Eastern Europe", "s": "“Golden Liberty” (Złota Wolność)", "sc": "noble democracy / elective monarchy", "note": "The king was elected by all nobles (wolna elekcja); a single deputy's veto (liberum veto) dissolved the assembly. Nobles were about a tenth of the population. Partitioned three times by Russia, Prussia and Austria by 1795.", "kn": "Same shape as Venice — rule by the few. The difference: its few were about a tenth of the population, and each held a veto, which is the direct reason it was partitioned.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.5, 0.9, 1.0, -0.5, -0.8, 1.0, -0.8, -0.5, -0.9, 0.8, -0.8, 0.5, 0.5, 0.5, 0.5, 0.8, 0.9, -0.3]}, {"id": "is_free", "f": "rep", "n": "The Icelandic Commonwealth", "p": "930–1262", "pl": "Iceland", "s": "“Alþingi” (the general assembly)", "sc": "stateless commonwealth", "note": "No king, no standing army, no executive. The lawspeaker (lögsögumaðr) recited the law each year at Þingvellir; disputes were settled by arbitration and outlawry. Submitted to the Norwegian crown in 1262.", "kn": "Same shape as the classical republic, but it has no state: law, assembly and judgment — everything except the power to enforce.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.5, 0.8, 1.0, 0.8, -0.8, 0.8, -0.8, -0.5, 0.5, 0.8, -0.5, 0.5, 0.5, 0.5, -0.5, 0.8, 0.9, -0.5]}, {"id": "sumer", "f": "rep", "n": "Sumerian city-states", "p": "3500–2000 BCE", "pl": "Mesopotamia", "s": "the “lugal” (big man) and the city assembly", "sc": "primitive democracy (Jacobsen, 1943)", "note": "Uruk, Lagash and Ur each went their own way. Temples held land and stores; the king was chosen by the god; early on there were still councils of elders and citizen assemblies. Urukagina's reforms at Lagash (c. 2350 BCE) are among the earliest written social legislation.", "kn": "Same shape as Athens (there is an assembly); the difference is that kingship was already hereditary and the economy belonged to the temple, not the citizens.", "v": [0.8, -0.8, -0.5, -0.5, 0, -0.8, 0.5, 0.5, 0.8, -0.5, -0.5, 0.5, -0.8, -0.5, -0.5, 0.5, -0.8, 0.5, 0.5, -0.5, -1.0, -0.5, 0.8, -0.5]}, {"id": "ch_old", "f": "rep", "n": "The Old Swiss Confederacy", "p": "1291–1798", "pl": "Switzerland", "s": "“the Eternal League” (Ewiger Bund)", "sc": "confederation / direct democracy", "note": "Three valley cantons (Uri, Schwyz, Unterwalden) allied against the Habsburgs, later growing to thirteen. No central organ, no standing army, no common currency. Formally left the Empire after the Thirty Years' War (1618–48).", "kn": "Same shape as the Icelandic Commonwealth; the difference is that it is a military alliance among cantons, not a compact among individuals.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.5, 0.9, 1.0, 0.8, -0.5, 0.5, -0.8, -0.5, 0.5, 0.8, -0.5, 0.5, 0.5, 0.5, 0.5, 0.8, 0.9, -0.5]}, {"id": "gana", "f": "rep", "n": "The republican clans of India's mahajanapada era", "p": "600–321 BCE", "pl": "South Asia", "s": "“gana-sangha” (assembly of the many)", "sc": "oligarchic republic / clan assembly", "note": "The age of the sixteen great states was not only monarchical: the Shakyas, the Licchavis and the Vajji confederacy governed by deliberation — rotating heads, assemblies on great matters, majority decision. The Buddhist discussions of “republican” procedure refer to them. Citizenship belonged only to noble clans; slaves and shudras were outside.", "kn": "Same shape as Athens (deliberation plus voting); the difference is that the voting unit is the clan, not the individual, and there is no sortition — seats are hereditary.", "v": [0.5, -0.8, -0.5, -0.5, 0, -0.5, 0, 0.5, 0.5, 0.8, -0.5, 0.5, -0.8, -0.5, -0.8, 0.8, -0.8, 0.5, 0.5, 0.5, -0.8, 0.8, 0.8, -0.5]}, {"id": "carthage", "f": "merc", "n": "Carthage", "p": "650–146 BCE", "pl": "North Africa", "s": "“Qart-ḥadašt” (the new city)", "sc": "commercial oligarchy / thalassocracy", "note": "Two suffetes and a senate, with real power in a few merchant families. It relied on maritime trade and mercenaries rather than citizen soldiers. Aristotle's *Politics* lists it with Sparta and Crete as an example of mixed government. Razed by Rome in 146 BCE.", "kn": "Same shape as Venice; the difference is its hinterland — the North African interior and Spanish silver mines, not just a sea route.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.9, 0.5, -0.5, -0.5, 0.5, 0.3, -0.8, -0.5, -0.9, 0.5, -0.8, 0.5, 0.5, 0.5, -0.5, -0.8, 0.5, -0.3]}, {"id": "venice", "f": "merc", "n": "The Republic of Venice", "p": "697–1797", "pl": "Italy", "s": "“La Serenissima” (the most serene republic)", "sc": "aristocratic republic / mercantile empire", "note": "The Great Council was “closed” in 1297 into a hereditary patrician register (the Serrata); thereafter only those on the register could govern. The doge's election procedure was complicated almost to the point of anti-fraud design. The Council of Ten handled security.", "kn": "Same shape as the Dutch Republic — commercial oligarchy. The difference: Venice wrote political rights into a closed hereditary register; the Dutch relied on property and city seats.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.9, 0.5, -0.5, -0.8, -0.8, 0.3, -0.9, -0.5, -1.0, 0.8, -0.8, 0.5, 0.5, 0.5, -0.5, -0.9, 0.3, -0.5]}, {"id": "genoa", "f": "merc", "n": "The Republic of Genoa", "p": "1099–1797", "pl": "Italy", "s": "“La Superba” (the proud republic)", "sc": "oligarchic republic / factional politics", "note": "Fought Venice for control of the Mediterranean; the battle of Curzola (1298) captured Marco Polo. Guelph and Ghibelline factions, nobles and commoners, fought endlessly, and the city was repeatedly taken over by outside powers (France, Milan, Spain).", "kn": "Same shape as Venice; the difference is that it never stabilized its oligarchy — factional fighting left it an order of magnitude weaker.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 1.0, 0.8, 0.5, -0.8, -0.5, 0.3, -0.8, -0.5, -1.0, 0.5, -0.8, 0.5, 0.5, 0.5, -0.5, -0.5, 0.5, -0.5]}, {"id": "florence", "f": "merc", "n": "The Republic of Florence", "p": "1115–1532", "pl": "Italy", "s": "“the Florentine people”", "sc": "guild republic / signoria", "note": "Seven great guilds (Arti Maggiori) monopolized political rights; the standard-bearer of justice (Gonfaloniere) was chosen by a mix of lot and election. The Medici ruled in practice after 1434 but kept the republican shell. Machiavelli wrote *The Prince* here.", "kn": "Same shape as Venice; the difference is that its political unit was the guild, not a register of families — so artisans had a period of real voice (the Ciompi revolt of 1378).", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 0.8, 0.8, 0.3, -0.5, -0.5, 0.5, -0.5, -0.5, -0.8, 0.5, -0.8, 0.5, 0.5, 0.5, -0.5, 0.8, 0.8, -0.5]}, {"id": "dutch", "f": "merc", "n": "The Dutch Republic", "p": "1581–1795", "pl": "Netherlands", "s": "“De Republiek” (the United Provinces)", "sc": "regent oligarchy / federal republic", "note": "Seven provinces each sovereign, with a stadtholder alongside the provincial states. Real power lay with the regenten — a handful of urban families. The VOC was founded in 1602, the world's first joint-stock company. Overthrown by French revolutionary armies in 1795.", "kn": "Same shape as Venice; the difference is that it is a federation of seven provinces, weaker at the centre than Venice, and the Reformation cut it off from the Catholic world.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 1.0, 1.0, 0.8, -0.5, -0.5, 0.5, -0.8, -0.5, -0.8, 0.8, -0.5, 0.5, 0.5, 0.5, -0.5, 0.8, 0.8, -0.5]}, {"id": "hansa", "f": "merc", "n": "The Hanseatic League", "p": "1356–1862", "pl": "Northern Europe", "s": "“the Hanse”", "sc": "city league / network governance", "note": "Lübeck, Hamburg, Danzig and others allied to control Baltic and North Sea trade. No constitution, no capital, no army: it enforced its will through trading posts (Kontore) and embargoes (as against Denmark in 1397). Its last assembly was in 1669.", "kn": "Same shape as the Dutch Republic; the difference is that it is not even a state — no sovereignty, no territory, only a chamber of commerce among cities.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, 1.0, 1.0, 1.0, -0.8, -0.5, 0.3, -0.9, -0.5, -0.9, 0.5, -0.8, 0.5, 0.5, 0.5, -0.5, -0.5, 0.9, -0.8]}, {"id": "eic", "f": "charter", "n": "India under the English East India Company", "p": "1757–1858", "pl": "South Asia", "s": "“Company Raj”", "sc": "chartered company rule", "note": "After Plassey (1757) the Company became the effective tax collector of Bengal, with an army, minting rights and judicial power. After the uprising of 1857, the Government of India Act (1858) transferred power to the Crown.", "kn": "Same shape as authoritarian bureaucracy; the difference is that the ruler's aim was dividends, not governance — which is why it raised taxes in famine years.", "v": [0.5, -0.5, -0.5, -0.5, -0.5, -0.5, 1.0, 0.5, -0.8, -0.8, 0.5, -1.0, -0.5, -0.5, -1.0, -0.8, -0.8, 0.5, 0.5, -0.5, -0.5, -0.8, -0.9, 0.5]}, {"id": "voc", "f": "charter", "n": "Indonesia under the Dutch East India Company", "p": "1602–1799", "pl": "Southeast Asia", "s": "“VOC”", "sc": "chartered company rule", "note": "Formed in 1602 from six chambers with a 21-year monopoly charter, empowered to declare war, make treaties and build forts. Batavia (1619) was its headquarters. Bankrupt in 1799; its territories passed to the Dutch state.", "kn": "Same shape as the English East India Company; the difference is that it was earlier and more purely commercial — it did not build an administrative state, only a spice monopoly.", "v": [0.5, -0.5, -0.5, -0.5, -0.5, -0.5, 1.0, 0.5, -0.8, -0.8, 0.5, -1.0, -0.5, -0.5, -1.0, -0.8, -0.8, 0.5, 0.5, -0.5, -0.5, -0.8, -0.9, 0.5]}, {"id": "congo", "f": "charter", "n": "The Congo Free State", "p": "1885–1908", "pl": "Central Africa", "s": "“the Congo Free State”", "sc": "personal colony / concessionary rule", "note": "The Berlin Conference assigned the Congo to Leopold II personally, not to Belgium. A rubber quota system; hands were cut off for failure to meet it. Millions are estimated to have died. Under international pressure it became a Belgian colony in 1908.", "kn": "It is not a company but a king's private domain; structurally it is identical to corporate rule — an army, taxation, no elections, no independent courts, and the books held by one man.", "v": [0.5, -0.5, -0.5, -0.5, -0.5, -0.5, 1.0, 0, -0.9, -0.8, 0.5, -1.0, -0.5, -0.5, -1.0, -0.8, -0.8, 0.5, 0.5, -0.5, -0.5, -0.9, -1.0, 0.5]}, {"id": "rhodesia", "f": "charter", "n": "Rhodesia under chartered company rule", "p": "1890–1923", "pl": "Southern Africa", "s": "“the British South Africa Company” (BSAC)", "sc": "company rule / settler colonialism", "note": "Cecil Rhodes's company occupied and governed present-day Zimbabwe and Zambia under a royal charter. Company rule ended in 1923; Southern Rhodesia became a self-governing colony.", "kn": "Same shape as the English East India Company; the difference is that it ruled a settler society, with racial segregation written into land law from the start.", "v": [0.5, -0.5, -0.5, -0.5, -0.5, -0.5, 0.8, 0.3, -0.8, -0.8, 0.5, -1.0, -0.5, -0.5, -1.0, -0.8, -0.8, 0.5, 0.5, -0.5, -0.5, -0.8, -0.9, 0.5]}, {"id": "forager", "f": "tribe", "n": "Hunter-gatherer bands", "p": "c. 100,000 BCE – present", "pl": "Worldwide", "s": "(no self-designation; usually “the people”)", "sc": "band society / immediate-return system", "note": "Bands of twenty or thirty, moving with the seasons: no private land, no permanent chief, no written rules. Disputes are settled by avoidance and migration — “voting with your feet” is literal here.", "kn": "Same shape as anarchism (order without a state); the difference is that the order rests on kinship and reciprocity, not on voluntary association or contract.", "v": [0.5, -0.9, -0.5, -0.5, 0.5, -0.5, -0.9, 0.5, 1.0, 0.8, -0.8, 0.3, -1.0, -0.5, 0.9, 0.8, -0.8, 0.5, -0.5, 0.5, -1.0, 0.8, 0.5, -1.0]}, {"id": "iroquois", "f": "tribe", "n": "The Iroquois Confederacy", "p": "c. 1450–1777", "pl": "North America", "s": "“Haudenosaunee” (people of the longhouse)", "sc": "confederacy / clan matron system", "note": "The Great Law (Gayanashagowa) established fifty chief seats, nominated and removable by clan mothers; the confederacy council decided by consensus. It is often said to have influenced the US Constitution (the claim remains disputed).", "kn": "Same shape as the classical republic (a written great law, a federal council, recall procedures); it is classed as tribal because the unit of power is the clan, not the individual, and there is no standing coercive force.", "v": [0.5, -0.8, -0.5, -0.5, 0.5, -0.5, -0.5, 0.8, 0.8, 0.8, -0.8, 0.6, -0.8, -0.5, 0.7, 0.8, -0.8, 0.5, 0.5, 0.5, -1.0, 0.8, 0.9, -0.8]}, {"id": "nuer", "f": "tribe", "n": "The Nuer", "p": "19th century", "pl": "South Sudan", "s": "(no centralized self-designation)", "sc": "acephalous / segmentary lineage (Evans-Pritchard, 1940)", "note": "No chiefs, no courts, no police, yet predictable order: maintained by the fission and fusion of patrilineal lineages and by the mediation of the “leopard-skin chief”. Anthropology's classic case of order without government.", "kn": "Same shape as anarchism; the difference is that the unit of order is the lineage segment, not the individual. The structure cannot scale beyond the tribe.", "v": [0.5, -0.9, -0.5, -0.5, 0.5, -0.5, -0.8, 0.5, 1.0, 0.8, -0.8, 0.3, -1.0, -0.5, 0.9, 0.5, -0.8, 0.5, -0.5, 0.5, -1.0, 0.8, 0.5, -1.0]}, {"id": "bigman", "f": "tribe", "n": "New Guinea big-man society", "p": "–20th century", "pl": "New Guinea Highlands", "s": "“big man” (anthropological term)", "sc": "big man system", "note": "Authority is not inherited but earned: prestige accumulated through pigs, feasts and gifts, then converted into followers. When the man dies, the authority disperses. There are no offices, only reputations.", "kn": "Same shape as populist mobilization (personal charisma rather than institution); the difference is that there is no state to capture — charisma converts into influence, never into power.", "v": [0.5, -0.8, -0.5, -0.5, 0.5, -0.5, -0.5, 0.5, 0.8, 0.8, -0.5, 0.3, -0.9, -0.5, 0.5, 0.5, -0.8, 0.5, 0.5, 0.5, -1.0, 0.8, 0.5, -1.0]}, {"id": "aboriginal", "f": "tribe", "n": "Australian Aboriginal societies", "p": "c. 50,000 BCE – 1788", "pl": "Australia", "s": "(order derived from the Dreaming)", "sc": "hunter-gatherer ontology / country", "note": "Not “tribes” but networks of language and ritual: hundreds of groups bound across distance by kinship classification and songlines. Land is not property but responsibility.", "kn": "Same shape as hunter-gatherer bands; the difference is that the carrier of order is ritual and songline — larger than kinship, smaller than a state.", "v": [0.5, -0.9, -0.5, -0.5, 0.5, -0.5, -1.0, 0.5, 1.0, 0.8, -0.8, 0.3, -1.0, -0.5, 0.9, 0.8, -0.8, 0.5, -0.5, 0.5, -1.0, 0.8, 0.5, -1.0]}, {"id": "zulu", "f": "milit", "n": "The Zulu kingdom under Shaka", "p": "1816–1879", "pl": "Southern Africa", "s": "“Zulu”", "sc": "militarized chiefdom / segmentary state", "note": "Shaka reorganized age regiments (amabutho), conscripting adult men by age into standing units across clans. A rare centralization in a tribal society. It defeated the British at Isandlwana in 1879 and was destroyed the same year.", "kn": "Same shape as militarist mobilization; the difference is that the unit of mobilization is the age regiment, not the citizen — which is why it could not survive Shaka's death.", "v": [0.5, -0.8, -0.5, -0.5, 0, -0.5, -0.5, 0.3, -0.8, -0.8, 0.5, -0.5, -0.8, -0.5, -0.8, 0.5, -0.8, 0.5, 0.5, 0.5, -0.5, -0.8, -0.8, -0.5]}, {"id": "egypt", "f": "premodern", "n": "Ancient Egypt under the pharaohs", "p": "3100–30 BCE", "pl": "Egypt", "s": "the pharaoh as the living Horus", "sc": "theocratic hydraulic state", "note": "The pharaoh was a god incarnate; the vizier headed a scribal class; the Nile's flood level set taxation and the calendar. The pyramids displayed state capacity and also document labour organization (the Giza workers' village had bakeries and medical records).", "kn": "Almost identical in political structure to Babylon and Assyria; the difference is the source of legitimacy — the pharaoh is himself a god and needs no code to mediate.", "v": [0.8, -0.9, -0.5, -0.5, 0.5, -0.8, -0.5, -0.5, -1.0, -0.8, 0.5, -1.0, -1.0, -0.5, -0.9, -0.5, -0.9, 0.5, 0.5, -0.5, -1.0, -0.9, -1.0, 0.9]}, {"id": "babylon", "f": "premodern", "n": "Babylon under Hammurabi", "p": "1894–539 BCE", "pl": "Mesopotamia", "s": "“king of Babylon, king of the four quarters”", "sc": "bureaucratic monarchy / cuneiform law", "note": "The Code of Hammurabi (c. 1754 BCE), 282 articles carved on a basalt stele and publicly displayed. Lex talionis (“an eye for an eye”) coexisted with rank distinctions (free, commoner, slave). Contracts, loans, marriage and irrigation disputes all have recorded judgments.", "kn": "Same shape as Egypt; it is the only one of these ancient empires to leave a complete written code and contract archive — which is why its “procedure” dimension is markedly higher than the others.", "v": [0.8, -0.8, -0.5, -0.5, 0, -0.8, -0.3, -0.3, -0.8, -0.5, -0.8, -0.8, -0.8, -0.5, -0.8, 0.8, -0.8, 0.5, 0.5, 0.5, -0.8, -0.5, -0.8, 0.5]}, {"id": "assyria", "f": "premodern", "n": "The Assyrian Empire", "p": "911–609 BCE", "pl": "Mesopotamia", "s": "“king of Assyria, king of the universe”", "sc": "military empire / state terror", "note": "A standing army, iron, siege engines; a resettlement policy that moved conquered populations wholesale to break identities. Royal inscriptions record flaying, blinding and heaps of heads — deliberate terror propaganda.", "kn": "Same shape as Egypt; the difference is the method — not theological consensus but resettlement and terror.", "v": [0.8, -0.9, -0.5, -0.5, -0.5, -0.8, -0.5, -0.8, -1.0, -0.8, 0.5, -1.0, -0.9, -0.5, -0.9, -0.8, -0.9, 0.5, 0.5, -0.5, -1.0, -0.9, -1.0, 1.0]}, {"id": "persia", "f": "premodern", "n": "The Achaemenid Persian Empire", "p": "550–330 BCE", "pl": "Persia", "s": "“king of kings”", "sc": "satrapy system / tolerant empire", "note": "The Cyrus Cylinder (539 BCE) is often called the first “human rights declaration” (an over-marketed claim). Twenty satrapies, governors appointed by the king, local law, religion and language retained. Royal road and courier system.", "kn": "Same shape as the Roman Empire (provinces plus toleration); the difference is that it had no concept of citizenship — subjects are not citizens.", "v": [0.5, -0.8, -0.5, -0.5, 0, -0.8, -0.3, -0.3, -0.5, -0.5, -0.5, -0.8, -0.8, -0.5, -0.8, 0.5, -0.8, 0.5, 0.5, 0.5, -0.5, 0.5, 0.5, 0.5]}, {"id": "maya", "f": "premodern", "n": "Maya city-states", "p": "2000 BCE – 1500 CE", "pl": "Mesoamerica", "s": "“k'uhul ajaw” (holy lord)", "sc": "theocratic city-states", "note": "Not an empire but dozens of warring city-states: Tikal, Calakmul, Palenque. The king mediated cosmic order; the calendar (Long Count) and writing were held by priests. The Classic collapse (c. 800–950) is still debated.", "kn": "Similar to the Greek poleis in being a world of city-states, but legitimacy and power run the opposite way: divine kings and calendars, not citizen assemblies — and each city is internally absolute, not decentralized.", "v": [0.8, -0.9, -0.5, -0.5, 0, -0.8, -0.5, -0.5, -0.8, -0.5, 0.5, -0.9, -0.9, -0.5, -0.9, -0.5, -0.9, 0.5, 0.5, -0.5, -1.0, -0.5, -0.5, 0.5]}, {"id": "shang", "f": "premodern", "n": "Shang China", "p": "1600–1046 BCE", "pl": "China", "s": "“the One Man”; the king as chief shaman", "sc": "theocratic kinship state / oracle bone polity", "note": "Oracle-bone inscriptions are the king's daily administrative record: asking about rain, war, toothache. Human sacrifice and burial of retainers were on a large scale (Houjiazhuang at Yinxu). Beyond the royal domain lay client states held by oath and campaign, not by commanderies.", "kn": "Same shape as Egypt; the difference is that beyond the royal domain it relied on client-state oaths — the radius of direct central rule was far smaller than Egypt's.", "v": [0.8, -0.9, -0.5, -0.5, 0, -0.8, -0.5, -0.5, -0.5, -0.5, 0.5, -0.9, -0.9, -0.5, -0.9, -0.5, -0.9, 0.5, 0.5, -0.5, -1.0, -0.8, -0.8, 0.8]}, {"id": "byzantium", "f": "premodern", "n": "The Byzantine Empire", "p": "330–1453", "pl": "Eastern Mediterranean", "s": "“the empire of the Romans” (Basileia ton Romaion)", "sc": "caesaropapism / orthodox autocracy", "note": "The emperor headed the church (caesaropapism); the patriarch was appointed by him. Justinian's *Corpus Juris Civilis* (529–534) was the channel by which Roman law reached modernity. The theme system granted land in exchange for military service.", "kn": "Same shape as Egypt (theocracy plus bureaucracy); the difference is that the church is an institution with its own tradition — the emperor governs it but cannot replace it.", "v": [0.8, -0.8, -0.5, -0.5, 0, -0.8, -0.3, -0.5, -1.0, -0.8, 0.5, -1.0, -0.8, -0.5, -0.9, 0.5, -0.8, 0.5, 0.5, -0.5, -0.5, -0.8, -0.9, 0.5]}, {"id": "ru_peter", "f": "modern", "n": "Peter the Great's Russia", "p": "1682–1725", "pl": "Russia", "s": "“emperor of all the Russias” (title assumed 1721)", "sc": "forced modernization / enlightened despotism", "note": "Beards cut, calendar changed, St Petersburg built, Academy of Sciences founded, alphabet reformed. The Table of Ranks (1722) tied noble status to service. Serfdom was tightened at the same time. The country was dragged into modernity by the whip.", "kn": "Same shape as Frederick's Prussia; the difference is the coerciveness of reform — this is not enlightenment but modernization executed as a military order.", "v": [0.5, -0.5, -0.5, -0.5, 0, -0.5, -0.3, -0.5, -1.0, -0.8, 0.5, -1.0, 0.5, 0.5, -0.9, -0.5, -0.9, 0.5, 0.5, -0.5, -0.5, -0.8, -1.0, 0.8]}, {"id": "at_habsburg", "f": "premodern", "n": "Habsburg Austria", "p": "1740–1918", "pl": "Austria", "s": "“the Austrian Empire” → “Austria-Hungary” (1867)", "sc": "composite monarchy / multinational empire", "note": "One dynasty ruled over a dozen languages: Germans, Hungarians, Czechs, Poles, Croats, Italians. The Compromise of 1867 gave Hungary semi-independence. Sarajevo in 1914; dissolution in 1918.", "kn": "Same shape as the Ottomans (a multinational empire); the difference is that it was stitched together by dynastic marriage rather than religious community, so it came apart as soon as nationalism rose.", "v": [0.8, -0.5, -0.5, -0.5, 0, -0.5, -0.3, -0.5, -0.5, -0.5, 0.5, -0.8, -0.8, -0.5, -0.9, -0.5, -0.8, 0.5, 0.5, -0.5, -0.8, -0.8, -0.5, 0.5]}, {"id": "cn_mingqing", "f": "premodern", "n": "Ming–Qing China", "p": "1368–1912", "pl": "China", "s": "“emperor by the Mandate of Heaven”", "sc": "imperial bureaucracy / examination state", "note": "The examinations made the bureaucracy a mobile class (in principle a commoner could become grand secretary); the Grand Secretariat and Grand Council were the emperor's secretariats, not decision-making bodies. The Mandate of Heaven supplied the grammar of legitimacy for dynastic change.", "kn": "Same shape as Louis XIV (absolute monarch plus secular bureaucracy); the difference is the examination — it let power circulate, but only in one direction: upward into office.", "v": [0.8, -0.8, -0.5, -0.5, 0.5, -0.8, -0.5, -0.5, -1.0, -0.8, 0.5, -0.8, -0.9, -0.5, -0.9, -0.8, -0.9, 0.5, 0.5, -0.5, -0.8, -0.8, -1.0, 0.8]}, {"id": "maurya", "f": "premodern", "n": "The Maurya Empire", "p": "322–185 BCE", "pl": "India", "s": "“chakravartin” (wheel-turner); Ashoka's edicts", "sc": "bureaucratic empire / dharmic kingship", "note": "Founded by Chandragupta; Ashoka (268–232 BCE) ruled through Buddhism and carved edicts on rock and pillars — South Asia's earliest written political communication. The *Arthashastra* systematically discusses spies, taxation and diplomacy. Caste (varna) was already fixed.", "kn": "Same shape as Persia (provinces plus toleration); the difference is that its social base is caste rather than subjects — that hierarchy outlived every dynasty.", "v": [0.8, -0.9, -0.5, -0.5, 0.5, -0.8, -0.5, -0.5, -0.9, -0.5, 0.5, -1.0, -0.8, -0.5, -0.9, -0.8, -1.0, 0.5, 0.5, -0.5, -0.8, -0.8, -0.5, 0.5]}, {"id": "hre", "f": "fd", "n": "The Holy Roman Empire", "p": "962–1806", "pl": "Central Europe", "s": "“the Holy Roman Empire” (Voltaire: neither holy, nor Roman, nor an empire)", "sc": "composite monarchy / Kleinstaaterei", "note": "Electors chose the emperor; the Imperial Diet and Imperial Chamber Court were both weak. Some three hundred principalities, knightly territories and free cities each went their own way. Dissolved by Napoleon in 1806.", "kn": "Same shape as feudal decentralization; the difference is that it had an imperial vacancy — the position elected was often one without real power.", "v": [0.8, -0.9, -0.5, -0.5, 0, -0.5, -0.3, -0.3, 0.8, -0.5, -0.5, 0, -0.9, -0.5, -0.9, -0.8, -0.8, 0.5, 0.5, -0.5, -0.8, -0.5, 1.0, 0.5]}, {"id": "kyiv_rus", "f": "fd", "n": "Kyivan Rus'", "p": "882–1240", "pl": "Eastern Europe", "s": "“the land of the Rus'”", "sc": "patrimonial feudalism / appanage system", "note": "The Rurikid dynasty rotated princes among Kyiv, Novgorod and Chernigov (the rota system) rather than practising primogeniture. Volodymyr's baptism in 988 made Orthodoxy the state religion. Kyiv fell to the Mongols in 1240.", "kn": "Same shape as Western European feudalism; the difference is the rotational succession instead of primogeniture, which made internal war the norm.", "v": [0.8, -0.9, -0.5, -0.5, 0, -0.5, -0.5, -0.5, 0.8, -0.5, -0.5, -0.5, -0.9, -0.5, -0.9, -0.8, -0.8, 0.5, 0.5, -0.5, -0.8, -0.5, 0.5, 0.5]}, {"id": "mongol", "f": "milit", "n": "The Mongol Empire", "p": "1206–1368", "pl": "Eurasian steppe", "s": "“Yeke Mongghol Ulus” (the Great Mongol State)", "  themselves as a closed caste. It does not answer those two well; neither does one-person-one-vote.", "Political Cynicism": "Cynicism is usually not laziness but disappointment after thinking. It is closer to the truth than blind trust, because politics does contain a great deal of performance. The price is giving up on change — if it is all theatre, nothing works. The conclusion does not hold, but the exhaustion is real.", "Left-Wing Populism": "In Chinese “populism” is close to an insult; in political science it is neutral — society split into ordinary people and a corrupt elite, with the elite having taken what belongs to the people. That diagnosis is sometimes right: when the people at the bottom raise a problem again and again and no one answers, when the rules are written by those who do not bear their consequences, “the elite is out of touch” is not a mood, it is a fact. Its failure is in the prescription: treating “the people” as one body erases the divisions inside it, and bypassing intermediary institutions lets the loudest speak for everyone. If you work at the front line, this result is not surprising: you deal with concrete people and concrete conflicts, while the people deciding these things are usually not there. “The elite is out of touch” is not a figure of speech in your mouth.", "Right-Wing Populism": "Same root as left populism: a pure people against a corrupt elite. The difference is an extra line — “the people” defined as nationals, and the blame assigned to migrants and supranational bodies. That line is where it slides into xenophobia, but its starting point is often real: when local jobs, housing and neighbourhoods change within a few years and nobody asked the people living there, the anger does not come from nowhere. The mistake is attributing “too much change too fast” to outsiders rather than to those who decided on the change.", "Liberalism": "Many people turn to liberalism not because they read Locke, but because they once stood in front of power: it did not explain, did not answer, kept no record, and there was nothing you could do about it. That experience yields a conclusion — power must be divided, recorded, and answerable. The conclusion is not the whole picture, but the starting point is real.", "Libertarianism": "Libertarianism often begins not in economics but in having been managed: ordinary decisions requiring permission, with the standard for permission invisible. People who have lived through that swing to the other end — if it harms no one, the state should keep out entirely. The reaction is understandable; the cost is that it tends to overlook the domains where no one managing makes things worse.", "State Capitalism": "Many people turn to state direction not because they believe in planning, but because they have been run over by the logic of profit: costs pushed onto someone else, gains kept. These produce a conclusion — some things cannot be left to people chasing profit. The conclusion is not the whole picture, but the starting point is real.", "Social Democracy": "Social democracy usually starts not in theory but in what untamed capitalism looks like: labour treated as replaceable, risk pushed onto those least able to carry it. Europe's nineteenth-century labour laws did not grow out of philosophical debate; they grew out of casualty figures. People who believe capitalism needs taming have usually seen it untamed first."}, "tie": {"0": ["A: Rules are made by people. If a rule is unreasonable, change it.", "B: Some things are not ours to set. Force a change and something breaks."], "1": ["A: How a person's life goes depends first on the society he lives in.", "B: How a person's life goes depends first on himself."], "2": ["A: History is pushed along by a few key decisions — another decision, another outcome.", "B: Once the trend arrives it happens. Anyone in charge would do about the same."], "3": ["A: Good institutions are designed. Think it through, then act.", "B: Good institutions grow. You adjust as you go."], "4": ["A: People are born with goodwill; badness is squeezed out of them by circumstances.", "B: People are born self-interested; goodness is what rules impose on them."], "5": ["A: Whether a claim is right depends on whether it can actually be realized.", "B: Whether a claim is right depends on whether it holds up in principle."], "6": ["A: Housing, healthcare and education should not be handed entirely to the market.", "B: Price is the best signal. The government should keep its hands off."], "7": ["A: As long as it harms no one else, people should live as they like.", "B: Some things need a rule even when they harm no one else."], "8": ["A: Local conditions differ too much — each place should decide for itself.", "B: If each place decides, it becomes chaos. There must be one standard."], "9": ["A: This kind of thing should be organized by the residents themselves.", "B: This kind of thing should be handled by the authority above."], "10": ["A: If the procedure was right, a bad outcome still has to be accepted.", "B: A bad outcome makes the procedure empty, however correct it was."], "11": ["A: A head should be appointed from above; he answers upward.", "B: A head should be elected by the members; he answers to them."], "12": ["A: Things are fine as they are. No need to stir them up.", "B: Standing still is falling behind. If it needs moving, move it."], "13": ["A: Pilot it first; roll it out once it works.", "B: Change it in one go — dragging it out only makes it worse."], "14": ["A: It takes one capable person to take the lead.", "B: It takes everyone pushing together."], "15": ["A: Between people who know each other, relationships come first.", "B: When something has to be done, rules come first."], "16": ["A: Same conditions, but one is one of us and one is an outsider — favouring our own is not wrong.", "B: Same conditions means the same treatment. Insider or outsider makes no difference."], "17": ["A: Technology is neutral; what matters is who uses it.", "B: A technology carries a direction the moment it exists; once in use it runs you."], "18": ["A: When you are not sure, better to go slow.", "B: Without some risk, nothing gets done."], "19": ["A: Bring in everyone you can, even those you have fallen out with.", "B: Cooperate only with those whose interests match; skip the sentiment."], "20": ["A: Behind the order of the world there is a being that responds.", "B: The world has laws only — no purpose, and it answers no one."], "21": ["A: Decide internally, publish the result — more efficient.", "B: The process itself must be public, or errors can never be corrected."], "22": ["A: One matter can only have one place where the final call is made.", "B: Several centres checking each other is more reliable than one."], "23": ["A: Put our own country in order first; other countries' affairs are not ours to manage.", "B: Many things can only be done across borders. National boundaries are no excuse."]}, "tieTitle": "Two people are arguing. Whom do you agree with more?"};

let ans = {}, cur = 0, ranking = {}, meta = {}, tie = {};
// timing is recorded only; it never enters the matching. Not `t` — that holds tie answers
let tm = { q:{}, chg:{}, start:0, end:0, idle:0, hiddenAt:0, show:0, last:0 };
const TOTAL = D.q.length;
// Tie-breakers are off by default: 11 human sheets and 11 figure profiles showed they reduce accuracy
const USE_TIE = false;

const PARAMS = {"ver": "2026-11-23", "thr": 0.3, "minK": 6, "cosGate": 0.7, "sortEps": 0.001, "verdictHigh": 0.72, "verdictMid": 0.6, "tieGap": 0.05, "tieCos": 0.1, "regimeMinK": 4, "regimeRate": 0.72, "regimeCos": 0.6, "regimeTieCos": 0.05};
const VER = PARAMS.ver;
const MIN_COS = PARAMS.cosGate;

try { const s = localStorage.getItem('pv4en'); if (s) { const o = JSON.parse(s); ans = o.a||{}; cur = o.c||0; ranking = o.r||{}; meta = o.m||{}; tie = o.t||{}; tm = o.tm || tm; } } catch(e) {}
// resumed next day: discard the timing; away for over 5 minutes: count it as away, not thinking
(function(){
  const now = Date.now();
  if (!tm.start) return;
  if (now - tm.start > 6*3600*1000) { tm = { q:{}, chg:{}, start:0, end:0, idle:0, hiddenAt:0, show:0, last:0 }; return; }
  if (tm.last && now - tm.last > 5*60*1000) tm.idle += now - tm.last;
  tm.end = 0; tm.hiddenAt = 0;
})();
function save(){ tm.last = Date.now(); try{ localStorage.setItem('pv4en', JSON.stringify({a:ans,c:cur,r:ranking,m:meta,t:tie,tm:tm,ver:VER})); }catch(e){} }

const app = document.getElementById('app');
const L = 'ABCDEFG';
function nm(x){ return (D.aName||{})[x] || x; }

if (typeof document !== 'undefined' && document.addEventListener) {
  let _tx = 0, _ty = 0;
  document.addEventListener('touchstart', e => { _tx = e.touches[0].clientX; _ty = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - _tx, dy = e.changedTouches[0].clientY - _ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
  }, {passive:true});
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { if (!tm.hiddenAt) tm.hiddenAt = Date.now(); }
    else if (tm.hiddenAt) { tm.idle += Date.now() - tm.hiddenAt; tm.hiddenAt = 0; save(); }
  });
  document.addEventListener('keydown', e => {
    if (cur < 0 || cur >= TOTAL) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
  });
}

function render(){
  if (cur < 0) return renderCover();
  if (cur >= TOTAL) {
    if (USE_TIE) {
      const nt = tieDims();
      if (nt.length && nt.some(i => tie[i] === undefined)) return renderTie(nt);
    }
    const need = metaDims();
    if (need.length && need.some(i => !meta[i])) return renderMeta(need);
    return renderResult();
  }
  const q = D.q[cur], picked = ans[q.n];
  const pct = Math.round(cur / TOTAL * 100);

  let opts = '';
  if (q.type === 'r') {
    const sel = ranking[q.n] || [];
    opts = '<div class="rank-hint">Choose as many as apply. The order you click is the order of importance; click again to remove.</div>';
    q.opts.forEach((t, i) => {
      const idx = sel.indexOf(i);
      opts += `<div class="rk ${idx>-1?'on':''}" data-r="${i}">
        <div class="key">${idx>-1?idx+1:L[i]}</div><div class="txt">${t}</div></div>`;
    });
  } else {
    q.opts.forEach((t, i) => {
      opts += `<div class="opt ${picked===L[i]?'on':''}" data-o="${L[i]}">
        <div class="key">${L[i]}</div><div class="txt">${t}</div></div>`;
    });
  }

  app.innerHTML = `
    <div class="bar">
      <div class="row"><span>${cur+1} / ${TOTAL}</span><span><span onclick="showNav()" style="cursor:pointer;text-decoration:underline;text-underline-offset:3px">Index</span>　${pct}%</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q">
      <div class="no">Question ${cur+1}</div>
      <h2>${q.t}</h2>
      <div id="opts">${opts}</div>
    </div>
    <div class="foot"><div class="inner">
      <button class="btn ghost" onclick="prev()">Back</button>
      ${allDone()?`<button class="btn ghost" onclick="toResult()">See result</button>`:''}
      <button class="btn" id="nx" onclick="next()">
        ${cur===TOTAL-1?'See result':'Next'}</button>
    </div></div>`;
  tm.show = Date.now();

  if (q.type === 'r') {
    document.querySelectorAll('.rk').forEach(el => el.onclick = () => {
      const i = +el.dataset.r;
      ranking[q.n] = ranking[q.n] || [];
      const p = ranking[q.n].indexOf(i);
      if (p > -1) ranking[q.n].splice(p,1); else ranking[q.n].push(i);
      save(); render();
    });
  } else {
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => {
      ans[q.n] = el.dataset.o;
      tmTouch(q.n, false);
      save();
      setTimeout(() => { if (cur < TOTAL-1) { cur++; save(); render(); } else render(); }, 130);
    });
  }
}

function next(){ if (cur < TOTAL) { cur++; save(); render(); window.scrollTo(0,0); } }
function allDone(){ return D.q.every(q => q.d === 0 || (q.type==='r' ? (ranking[q.n]&&ranking[q.n].length) : !!ans[q.n])); }
function toResult(){ cur = TOTAL; save(); render(); window.scrollTo(0,0); }
function backToEdit(){ cur = 0; tm.end = 0; save(); render(); window.scrollTo(0,0); }
function prev(){ if (cur > 0) { cur--; save(); render(); window.scrollTo(0,0); } }

function showNav(){

// ===== tie-breakers: only when the two questions of a dimension disagree =====
function tieDims(){
  const buckets = {};
  D.q.forEach(q => {
    if (!q.o || !D.qmap[q.o] || q.type === 'r') return;
    const [dim, map] = D.qmap[q.o];
    const c = ans[q.n]; if (!c) return;
    const v = map[c]; if (v === null || v === undefined) return;
    (buckets[dim-1] = buckets[dim-1] || []).push(v);
  });
  const out = [];
  for (const k in buckets) {
    const b = buckets[k];
    if (b.length < 2) continue;
    const strong = b.filter(v => Math.abs(v) >= 0.3);
    if (strong.length >= 2 && Math.max(...strong) > 0 && Math.min(...strong) < 0) out.push(+k);
  }
  return out.slice(0, 5);
}

// ===== timing =====
function tmTouch(n, isRank){
  const now = Date.now();
  if (!tm.start) tm.start = now;
  if (!isRank && tm.show) {

function fmtDur(ms){
  const s = Math.round(ms/1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s/60), r = s%60;
  return m + 'm' + (r ? ' ' + r + 's' : '');
}
function timeStats(){
  const now = tm.end || Date.now();
  const idle = tm.idle + (tm.hiddenAt ? now - tm.hiddenAt : 0);
  const total = tm.start ? Math.max(0, now - tm.start) : 0;
  const active = Math.max(0, total - idle);
  const ns = Object.keys(tm.q).filter(k => (tm.q[k]||0) > 0);
  const times = ns.map(k => tm.q[k]);
  const sorted = times.slice().sort((a,b)=>a-b);
  const med = sorted.length ? sorted[Math.floor(sorted.length/2)] : 0;
  const mean = times.length ? times.reduce((a,b)=>a+b,0)/times.length : 0;
  const fast = times.filter(x=>x<2000).length;
  const changed = Object.keys(tm.chg).filter(k=>tm.chg[k]>1).length;
  let fastIdx=0, slowIdx=0, mn=Infinity, mx=-Infinity;
  ns.forEach(k=>{ const v=tm.q[k]; if(v<mn){mn=v;fastIdx=+k;} if(v>mx){mx=v;slowIdx=+k;} });
  const answered = D.q.filter(q=>q.d!==0 && (q.type==='r' ? (ranking[q.n]&&ranking[q.n].length) : !!ans[q.n])).length;
  let verdict='Normal';
  if (!answered) verdict='No answers';
  else if (med && med < 3000) verdict='Fast';
  else if (times.length && fast/times.length > 0.4) verdict='Fast';
  else if (active && active < 300000 && answered >= TOTAL*0.8) verdict='Short';
  else if (med > 90000) verdict='Slow';
  return {total,idle,active,med,mean,fast,changed,fastIdx,slowIdx,n:times.length,answered,verdict};
}
function timeLine(){
  if (!tm.start || !Object.keys(tm.q).length) return '';
  const t = timeStats();
  if (!t.total) return '';
  return `<div style="font-size:11.5px;color:#bbb;line-height:1.9;margin-top:18px;text-align:center">
    This session ${fmtDur(t.total)}${t.idle>60000?` (active ${fmtDur(t.active)}, away ${fmtDur(t.idle)})`:''} · median ${fmtDur(t.med)} per question · ${t.changed} changed · quality: ${t.verdict}

}

// ===== scoring =====
function cos(a,b){
  let d=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){ d+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  return (na&&nb)? d/Math.sqrt(na*nb) : 0;
}
function nrm(a){ return Math.sqrt(a.reduce((s,x)=>s+x*x,0)); }

function score(){
  const buckets = Array.from({length:D.dims.length},()=>[]);
  const marks = [];
  let skipped = 0;

  D.q.forEach(q => {
    const orig = q.o;
    if (!orig || !D.qmap[orig]) return;
    const [dim, map] = D.qmap[orig];
    if (q.type === 'r') {
      const sel = ranking[q.n] || [];
      if (!sel.length) { skipped++; return; }
      return;
    }
    const c = ans[q.n];
    if (!c) { skipped++; return; }
    const v = map[c];
    if (v === null || v === undefined) {
      const m = (D.marks[orig]||{})[c];
      if (m) marks.push(m);
      return;
    }
    buckets[dim-1].push(v);
  });

  const vec = buckets.map((b, i) => {
    if (USE_TIE && (tie[i] === 0 || tie[i] === 1)) return tie[i] === 0 ? -0.9 : 0.9;
    return b.length ? b.reduce((s,x)=>s+x,0)/b.length : 0;
  });
  const missing = buckets.map((b,i)=>b.length?null:D.dims[i]).filter(Boolean);

  const THR = PARAMS.thr, MIN_K = PARAMS.minK;
  const res = Object.entries(D.anchors).map(([n,a]) => {
    const idx = [];
    for (let i = 0; i < vec.length; i++)
      if (Math.abs(vec[i]) >= THR && Math.abs(a[i]) >= THR) idx.push(i);
    const vv = idx.map(i => vec[i]), aa = idx.map(i => a[i]);
    const c = idx.length >= MIN_K ? cos(vv, aa) : null;
    const same = idx.filter(i => (vec[i] >= 0) === (a[i] >= 0)).length;
    return {
      n, c, m: nrm(a),
      k: idx.length, s: same,
      r: idx.length ? (same + 1) / (idx.length + 2) : 0,
      r0: idx.length ? same / idx.length : 0,
      full: cos(vec, a),
    };
  }).sort((x, y) => {
    if (x.c === null && y.c === null) return 0;
    if (x.c === null) return 1;
    if (y.c === null) return -1;
    if (Math.abs(y.r - x.r) > PARAMS.sortEps) return y.r - x.r;
    return y.c - x.c;
  });

  const a2c = {};
  Object.entries(D.clusters).forEach(([c,ms]) => ms.forEach(m => a2c[m]=c));

  const mid6 = buckets[5].length > 0 && buckets[5].every(x => Math.abs(x) < 0.4);
  const conflictDims = buckets
    .map((b, i) => {
      if (b.length < 2) return null;
      const strong = b.filter(x => Math.abs(x) >= 0.3);
      if (strong.length >= 2 && Math.max(...strong) > 0 && Math.min(...strong) < 0) return i;
      return null;
    })
    .filter(x => x !== null);

  return {vec, missing, skipped, marks, res, a2c, mid6, conflictDims};
}

function verdict(c, g, r, k, hard, gc){
  if (k < 8)              return 'Too few comparable dimensions to judge';
  const tie = g < PARAMS.tieGap && (gc === undefined || gc < PARAMS.tieCos);
  const h = hard || 0;
  if (h >= 3)             return `Directionally close, but ${h} dimensions point opposite — not a safe attribution`;
  if (r >= 0.85 && c >= 0.70) {
    if (tie) return 'Highly consistent, but two traditions are tied';
    return h ? `Highly consistent, with ${h} opposing dimensions` : 'Highly consistent';
  }
  if (r >= 0.85)          return `Direction is highly consistent, but strength differs a lot${h?`, and ${h} dimensions point opposite`:''}`;
  if (r >= PARAMS.verdictHigh) {
    if (k < 11)          return `Partly consistent (only ${k} comparable dimensions — weak basis)`;
    return tie ? 'Consistent in direction, but cannot tell which branch' : `Consistent in direction${h?`, with ${h} opposing dimensions`:''}`;
  }
  if (r >= PARAMS.verdictMid)          return 'Partly consistent';
  return 'Not consistent';
}

function diagnose(vec, conflictDims){
  const rank = vec.map((v,i)=>({i, v, a:Math.abs(v)}));
  const core = rank.filter(x=>x.a>=0.6).sort((x,y)=>y.a-x.a).slice(0,3);

  for (const key of Object.keys(D.layers)) {

    {x:15, y:9,  sx: 1, sy:-1, say:'You believe change needs majority participation, yet you want power concentrated. Both hold only if the concentrated power is willing to let the majority decide.'},
    {x:13, y:14, sx:-1, sy: 1, say:'You think things are broadly fine, and you also want a thorough change. These cannot both be true — either the present is worth keeping, or it must be rebuilt.'},
    {x:11, y:12, sx: 1, sy:-1, say:'You care about results, not about who chose whom. The price: nobody can remove a good performer, and nobody can remove a bad one either.'},
  ];
  const cross = TENSIONS
    .filter(t => Math.abs(vec[t.x-1]) >= 0.5 && Math.abs(vec[t.y-1]) >= 0.5
              && Math.sign(vec[t.x-1]) === t.sx && Math.sign(vec[t.y-1]) === t.sy)
    .map(t => ({a:t.x-1, b:t.y-1, say:t.say}));

  const neutral = rank.filter(x => x.a < 0.25 && x.i !== 5);
  return {core, layers, cross, neutral};
}

// ===== historical regimes =====
function regimeScore(vec, a){
  const THR = PARAMS.thr;
  const idx = D.regSub.filter(i => Math.abs(vec[i]) >= THR && Math.abs(a[i]) >= THR);
  if (idx.length < 4) return null;
  const same = idx.filter(i => vec[i] * a[i] > 0).length;
  const dot = idx.reduce((t,i)=>t+vec[i]*a[i], 0);
  const na = Math.sqrt(idx.reduce((t,i)=>t+vec[i]*vec[i], 0)) || 1;
  const nb = Math.sqrt(idx.reduce((t,i)=>t+a[i]*a[i], 0)) || 1;
  return { k: idx.length, rate: (same+1)/(idx.length+2), cos: dot/(na*nb),
           conf: idx.length - same, idx };
}
function regimeHits(vec){
  const tags = (D.regimes || []).map(t => ({ t, s: regimeScore(vec, t.v) }))
    .filter(x => x.s && x.s.k >= 4);
  if (!tags.length) return [];
  tags.sort((a, b) => b.s.cos - a.s.cos);
  const fit = (famId) => {
    const f = (D.regFams || []).find(x => x.id === famId);
    if (!f) return null;
    const fs = regimeScore(vec, f.v);
    if (!fs || fs.k < PARAMS.regimeMinK || fs.rate < PARAMS.regimeRate || fs.cos < PARAMS.regimeCos) return null;
    return fs;
  };
  const out = [], seen = {};
  for (const x of tags) {
    const famId = x.t.f;
    if (seen[famId]) continue;
    const fs = fit(famId);
    if (!fs) continue;
    seen[famId] = 1;
    const f = D.regFams.find(y => y.id === famId);
    const ms = tags.filter(y => y.t.f === famId).slice(0, 4);
    out.push({ f, s: fs, ms, bestCos: x.s.cos });
    if (out.length >= 3) break;
  }
  out.sort((a, b) => b.bestCos - a.bestCos);
  return out;
}
function regimeAll(){

  (D.regimes || []).forEach(t => { (byFam[t.f] = byFam[t.f] || []).push(t); });

function partCard(){
  const st = partState();
  if (!st) return '';
  return `<div class="card">
    <h3>How you stand toward politics</h3>
    <div style="font-size:13.5px;line-height:1.85;color:#3a3a3a;margin-bottom:12px">${st.say} ${st.note}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">
      ${partCell('lH', st.key, 'Free rider', 'no attention · believes it works')}
      ${partCell('hH', st.key, 'Engaged', 'attention · believes it works')}
      ${partCell('lL', st.key, 'Disengaged', 'no attention · does not believe')}
      ${partCell('hL', st.key, 'Attentive but sceptical', 'attention · does not believe')}
    </div>
    <div style="font-size:11.5px;color:#bbb;line-height:1.8;margin-top:10px">
      Horizontal axis: attention. Vertical: efficacy. No cell is the “normal” baseline; the dark one is simply where you are.${st.resp?`<br>You also think decision-makers would respond to ordinary people: <b style="color:#999">${st.resp}</b>`:''}
    </div>
  </div>`;
}

// shape too different: no tradition named, describe the dimensions instead
function noStanceHtml(S){
  const top = S.res[0];
  const strong = S.vec.map((v,i)=>({i,v,a:Math.abs(v)}))
    .filter(x=>x.a>=0.6).sort((x,y)=>y.a-x.a).slice(0,4);
  const items = strong.map(x=>`· <b>${dimLabel(x.i)}</b> — ${lvlWord(x.a)} toward ${sideName(x.v,x.i).toLowerCase()} (${x.v>0?'+':''}${x.v.toFixed(1)})`).join('<br>');
  return `<div class="card">
    <h3>No clear political stance</h3>
    <div style="font-size:13.5px;line-height:1.95;color:#3a3a3a;margin-bottom:14px">
      The closest shape is “${nm(top.n)}”, but its strength is only ${(top.c*100).toFixed(0)}% — below the 70% threshold. The gap is not a lack of data: it is not the same structure as yours.
    </div>
    ${strong.length?`<div style="font-size:12px;color:#999;margin-bottom:6px">Where you are clearer than most</div>
    <div style="font-size:13.5px;line-height:1.95;color:#3a3a3a;margin-bottom:14px">${items}</div>`:''}
    <div style="font-size:13px;line-height:1.9;color:#555">
      These leanings do not add up to a programme. The ${Object.keys(D.anchors).length} traditions answer “how should power be organised, how should the economy be arranged” and “what is worth pursuing”; your answers sit mostly in one or two layers, with little said about institutions. That is not a defect — most people are like this.
    </div>
    ${(S.vec[16] <= -0.5 || S.vec[1] <= -0.5)?`<div style="font-size:13px;line-height:1.95;color:#3a3a3a;margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0">
      This combination has a name. Fei Xiaotong called it the “differential mode of association”: a self at the centre, circles of obligation reaching outward, heavier the closer they are. Liang Shuming described China as “ethically based” — neither individual-centred nor society-centred.<br><br>
      This is not an absence of thought. What you care about is concrete people — parents, family, colleagues, neighbours — rather than how institutions ought to be designed. In a test that treats “governing the realm” as the highest question, that care gets recorded as “no position”; in ordinary life it is more use than any programme. Any society holds together because of people handling concrete things day after day, not because of a few people arguing about systems.
    </div>`:''}
    <div style="font-size:13px;line-height:1.9;color:#3a3a3a;margin-top:12px;padding:13px 15px;background:#f7f7fa;border-radius:9px">
      <b>If you want to take it one step further</b><br>
      The ten dimensions this test asks about come down to three questions: <b>who holds power · how it is acquired · how it ends</b>. None of them requires a position — only that you see two things clearly: what the answer is where you live, and what you think it should be.
    </div>
    <div style="font-size:11.5px;color:#bbb;line-height:1.8;margin-top:14px;border-top:1px solid #f0f0f0;padding-top:12px">
      Threshold: a tradition is named only when shape similarity is at least 70%. The line was calibrated on 11 figures answering from primary texts — all above 81%; free-form answers mostly land between 30 and 70%.
    </div>
  </div>`;
}

// finite vs permanent problems: not scored, description only
function probCard(){
  const q44 = D.q.find(x => x.o === '44');
  const a = q44 ? ans[q44.n] : null;
  if (!a) return '';
  const m = {
    A: ['Problems are finite', 'You believe problems can be solved one at a time, given time. That belief is what makes long-term goals worth taking seriously — you only set out if you think there is an end.'],
    B: ['Problems improve by replacement', 'You believe old problems get solved and new ones appear, but on the whole it improves. The most common view, and the working assumption of most reformers.'],
    C: ['Problems only change form', 'You believe problems never run out, they only take another shape. It keeps you sceptical of promises of a final solution, but can make you underestimate what has actually been solved.'],
    D: ['Some problems have no solution', 'You believe some problems are unsolvable and all you can do is ease the pain. This does not make people cold — it usually makes them care more about the concrete things that can be lightened.'],
  }[a];
  if (!m) return '';
  return `<div class="card">
    <h3>How you see “the problem itself”</h3>
    <div style="font-size:15px;font-weight:600;margin-bottom:6px">${m[0]}</div>
    <div style="font-size:13px;line-height:1.9;color:#3a3a3a">${m[1]}</div>
    <div style="font-size:11.5px;color:#bbb;line-height:1.8;margin-top:10px">Not part of the matching. It describes your view of whether problems have an end, not your view of any institution.</div>
  </div>`;
}

function renderResult(){
  const S = score();
  if (!S.res.length || S.res[0].c === null) {
    app.innerHTML = `<div class="res"><h1>Your result</h1>
      <div class="card"><h3>Not enough information</h3>
      <div style="font-size:14px;line-height:1.9">On too many questions you chose “it depends / can't say / none of my business”. There are not enough dimensions to compare you with any tradition.<br><br>That is not a problem. It only means you do not care much about what this questionnaire asks.<br>If you want to know whom you resemble, go back and answer those questions again, giving a direction where you can.</div></div>
      <button class="btn ghost" onclick="restart()">Start over</button></div>`;
    window.scrollTo(0,0);
    return;
  }
  const top = S.res[0];
  const noStance = top.c < MIN_COS;
  const gap = (S.res.length>1 && S.res[1].c !== null) ? top.r - S.res[1].r : 0;
  const dg = diagnose(S.vec, S.conflictDims);
  const info = noStance ? null : (D.info||{})[top.n];
  const isMethod = !noStance && (D.methodAnchors||[]).includes(top.n);
  // freeze the clock when the result first renders, so time spent reading it is not counted
  if (!tm.end && tm.start) { tm.end = Date.now(); save(); }
  const TS = timeStats();
  const quickWarn = TS.verdict==='Fast' ? `<div class="warn" style="margin-bottom:16px"><b>This was answered very quickly</b><br>Median ${fmtDur(TS.med)} per question${TS.fast?`, ${TS.fast} answered in under 2 seconds`:''}. The result is still yours, but treat it as a rough indication rather than a conclusion.</div>` : '';

  const coreHtml = dg.core.length
    ? dg.core.map(x=>`<div class="rk-item"><span style="flex:1;cursor:pointer" onclick="showDimInfo(${x.i})">${dimLabel(x.i)}<span class="dimhint">?</span><span style="display:block;font-size:11px;color:#b3b3b3;letter-spacing:.2px;margin-top:2px">${dimEn(x.i)}</span></span>
        <span class="s">${dimText(x.v, x.i, S.mid6)}</span></div>`).join('')
    : `<div style="font-size:14px;color:#888">You reach no “clear” strength in any direction. That may mean you are still weighing things.</div>`;

  let layerHtml = '';
  dg.layers.forEach(Ly => {
    const s2 = Ly.items.filter(x=>x.a>=0.5).slice(0,2);
    const desc = s2.length
      ? 'In this layer your clearest positions are: ' + s2.map(x=>`<b>${dimLabel(x.i)}</b> ${sideName(x.v,x.i)} (${lvlWord(x.a)})`).join('; ')
      : 'You have no marked leaning in this layer.';
    const rows = Ly.items.map(x=>
      `<div class="rk-item"><span style="flex:1;font-size:13px;cursor:pointer;line-height:1.45" onclick="showDimInfo(${x.i})">${dimLabel(x.i)}<span class="dimhint">?</span><br><span style="font-size:10px;color:#c4c4c4">${dimEn(x.i)}</span></span>
       <span class="s" style="font-size:13px">${dimText(x.v, x.i, S.mid6)}</span></div>`).join('');
    layerHtml += `<div class="card">
      <h3>${Ly.name}<span style="font-size:12px;color:#aaa;margin-left:8px;font-weight:400">${Ly.n} dimensions</span></h3>
      <div style="font-size:14px;line-height:1.85;margin-bottom:6px">${desc}</div>
      <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:#888">Show all ${Ly.n}</summary>
        <div style="margin-top:10px">${rows}</div>
      </details>
    </div>`;
  });

  const crossHtml = dg.cross.length
    ? `<div class="card"><h3>Tensions in your position</h3>
       ${dg.cross.map((c,idx)=>`<div style="font-size:14px;line-height:1.9;${idx?'margin-top:16px':''}">
         <b>${idx+1}. ${dimLabel(c.a)} × ${dimLabel(c.b)}</b><br>${c.say}
       </div>`).join('')}</div>`
    : '';

  const unc = uncovered(S);
  const isConf = new Set(unc.conflicts.map(c => c.i));
  const resolved = unc.conflicts.filter(c => tie[c.i] === 0 || tie[c.i] === 1);
  const conf = unc.conflicts.filter(c => tie[c.i] !== 0 && tie[c.i] !== 1 && !meta[c.i]);
  const careList = unc.neutral.filter(x => meta[x.i] === 'care');
  const ctxList  = unc.neutral.filter(x => meta[x.i] === 'ctx');
  const plainList = unc.neutral.filter(x => !meta[x.i] && !isConf.has(x.i));
  const neutralHtml = (unc.neutral.length || conf.length) ? `<div class="card">
    <h3>Dimensions not compared</h3>
    ${resolved.length?`<div style="font-size:13px;line-height:1.85;color:#3a3a3a;margin-bottom:10px"><b style="color:#8a6d3b">Counted after the follow-up</b>　${resolved.map(c=>dimLabel(c.i)).join('; ')}. Your two answers disagreed; the direction you picked is used.</div>`:''}
    ${conf.map(c => `<div style="font-size:13px;line-height:1.85;color:#3a3a3a;margin-bottom:10px">
      <b style="color:#8a6d3b">Two answers point opposite</b>　${dimLabel(c.i)} — ${c.items.map(x=>`you chose “${x.q.opts[L.indexOf(x.c)]}”`).join(', and on the other')}. The directions cancel, so this dimension counts as 0.</div>`).join('')}
    ${ctxList.length?`<div style="font-size:13px;line-height:1.85;color:#3a3a3a;margin-bottom:10px"><b style="color:#8a6d3b">Depends on context</b>　${ctxList.map(x=>dimLabel(x.i)+(isConf.has(x.i)?' (the two answers point opposite)':'')).join('; ')}. Not the absence of a position — different answers in different situations. Your judgement is case-based rather than principled.</div>`:''}
    ${careList.length?`<div style="font-size:13px;line-height:1.85;color:#3a3a3a;margin-bottom:10px"><b>Genuinely indifferent</b>　${careList.map(x=>dimLabel(x.i)).join('; ')}. These questions are not a problem for you.</div>`:''}
    ${plainList.length?`<div style="font-size:13px;line-height:1.85;color:#3a3a3a;margin-bottom:10px"><b>No clear leaning</b>　${plainList.map(x=>dimLabel(x.i)).join('; ')}.</div>`:''}
    <div style="font-size:11.5px;color:#bbb;line-height:1.75;margin-top:10px">These take part in no comparison, so the conclusion above rests on the remaining ${D.dims.length - unc.neutral.length} dimensions.</div>
  </div>` : '';

  const topHtml = noStance ? noStanceHtml(S) : `<div class="card">
    <h3>Closest tradition</h3>
    <div style="font-size:22px;font-weight:600;margin:2px 0 2px">${nm(top.n)}</div>
    <div style="font-size:12px;color:#aaa;letter-spacing:.3px;margin-bottom:8px">${anchorEn(top.n)}</div>
    <div style="font-size:13px;color:#888;margin-bottom:6px">${top.k} comparable dimensions, ${top.s} pointing the same way　match ${(top.r*100).toFixed(0)}%　strength ${(top.c*100).toFixed(0)}%</div>
    <div style="font-size:13px;color:${gap>=0.05?'#888':'#c00'};margin-bottom:${top.k<8?'8px':'16px'}">${gap>=0.05?`${(gap*100).toFixed(0)} points ahead of the second`:`Almost tied with the second (${(gap*100).toFixed(0)} points apart) — you are between the two, or the two are simply alike`}</div>
    ${(()=>{const vs=(D.variants||{})[top.n]; if(!vs) return '';
      const ns=Object.keys(vs); if(!ns.length) return '';
      return `<div style="font-size:13px;color:#555;margin-bottom:16px">This branch also contains: <b style="color:#111">${ns.join('; ')}</b>. This test cannot separate you from them.</div>`;})()}
    ${['Technocracy Movement','State Capitalism'].includes(top.n)?`<div style="font-size:13px;color:#555;margin-bottom:16px">If what you care about is <b>developing productive forces, conquering nature, and concentrating power for big projects</b> rather than efficiency or technology as such, you may be closer to “industrialist / productivism” — this test has no such dimension and cannot tell.</div>`:''}
    ${top.k<8?`<div class="warn" style="margin-bottom:16px"><b>This result rests on thin evidence</b><br>Only <b>${top.k}</b> dimensions are comparable between you and it (in the other ${D.dims.length-top.k}, at least one side has no clear position). All ${top.k} point the same way, so the direction fits — but the sample is too small to say “you are this”.<br>For a better read, go back and give a direction on the questions you answered “it depends / can't say / none of my business”.</div>`:''}
    ${top.k>=8&&top.k<12?`<div style="font-size:12px;color:#b8860b;margin-bottom:8px">Note: only ${top.k} dimensions are comparable, so this is weaker than a 12+ dimension result.</div>`:''}
    ${quickWarn}
    ${(()=>{const ab=S.vec.map((v,i)=>({d:D.dims[i],v})).filter(x=>Math.abs(x.v)<0.3);
      if(!ab.length) return '';
      return `<div style="font-size:12px;color:#999;margin-bottom:16px;line-height:1.75">You have no clear position on <b>${ab.length}</b> dimensions: ${ab.map(x=>x.d).join('; ')}. They take part in no comparison, so the conclusion rests on the remaining ${D.dims.length-ab.length}.</div>`;})()}
    ${info?`
      <div style="font-size:15px;line-height:1.85;margin-bottom:16px">${info.one}</div>
      <div style="font-size:12px;color:#999;margin-bottom:4px">Figures</div>
      <div style="font-size:14px;line-height:1.7;margin-bottom:16px">${info.figures}</div>
      <div style="font-size:12px;color:#999;margin-bottom:6px">Core claims</div>
      <ul style="margin:0 0 16px 18px;font-size:14px;line-height:1.95">${info.tenets.map(t=>`<li>${t}</li>`).join('')}</ul>
      ${info.history?`<div style="font-size:12px;color:#999;margin-bottom:6px">History</div>
        <div style="font-size:14px;line-height:1.95;margin-bottom:16px;color:#3a3a3a">${info.history}</div>`:''}
      <div class="warn"><b>Common misreading</b><br>${info.misread}</div>
      ${(D.fair||{})[top.n]?`<div style="font-size:13px;line-height:1.9;color:#3a3a3a;margin-top:12px;padding:13px 15px;background:#f4f7f4;border-radius:9px"><b style="color:#4a6a4a">In its defence</b><br>${D.fair[top.n]}</div>`:''}
      <div style="font-size:13px;color:#555;margin-top:14px">Where to read more: ${info.read}</div>
    `:''}
    ${isMethod?`<div class="warn" style="margin-top:14px"><b>This is a method, not a political position</b><br>It describes how you decide what is true, and it spans the left–right spectrum. Your <b>method of judgement</b> resembles it; your political position is in the core principles below.</div>`:''}
  </div>`;

  const refHtml = (!noStance && S.res.length>1 && S.res[1].c !== null) ? `<div class="card">
    <h3>Another reference</h3>
    ${(()=>{ const r=S.res[1], inf=(D.info||{})[r.n]; return `<div>
      <div style="font-weight:600">${nm(r.n)}<span style="font-size:12px;color:#888;margin-left:8px">${r.s}/${r.k} dimensions aligned</span></div>
      ${inf?`<div style="font-size:13px;color:#555;margin-top:4px;line-height:1.8">${inf.one}</div>
      <div style="font-size:12px;color:#999;margin-top:4px">Figures: ${inf.figures}</div>`:''}
    </div>`; })()}
    <div style="font-size:12px;color:#aaa;line-height:1.7;margin-top:12px">This is not a label for you. Where you differ is exactly in the dimensions that point the other way above.</div>
  </div>` : '';

  app.innerHTML = `
  <div class="res">
    <h1>Your result</h1>

    ${topHtml}

    ${(()=>{
      if (noStance) return '';
      const hits = regimeHits(S.vec);
      if(hits.length >= 2 && (hits[0].bestCos - hits[1].bestCos) < PARAMS.regimeTieCos){
        return `<div class="card">
          <h3>On the border between several regimes</h3>
          <div style="font-size:13.5px;line-height:1.95;color:#3a3a3a">
            Your combination on “how the polity is arranged” sits close to several families at once: <b>${hits.slice(0,3).map(h=>h.f.n).join(', ')}</b>.<br><br>
            They are too close to call. Naming one would be half right. This is not a data problem: these families are structurally adjacent — they differ mainly in religion, economic form and how rulers described themselves, and this test measures none of the three.
          </div>${regimeDetails()}</div>`;
      }
      if(!hits.length) return `<div class="card">
        <h3>No clear historical counterpart</h3>
        <div style="font-size:13.5px;line-height:1.95;color:#3a3a3a">
          Your combination across the ten dimensions of political structure does not match any regime that actually existed.<br><br>
          That is not an error — it is the normal case: <b>real regimes are coherent; people are mixed</b>. A workable regime has to make economy, power and legitimacy line up. A person's answers often want “a strong state” and “more decentralization”, “rules” and “relationships” at the same time — combinations that work on paper but that no government has ever run.
        </div>${regimeDetails()}
      </div>`;
      const h = hits[0], best = h.ms[0], others = h.ms.slice(1,4);
      return `<div class="card">
        <h3>Your position in history is closest to</h3>
        <div style="font-size:19px;font-weight:600;margin:2px 0 4px">${h.f.n}</div>
        <div style="font-size:13px;color:#888;margin-bottom:10px">${h.f.d}</div>
        <div style="font-size:12px;color:#aaa;margin-bottom:14px">Based on ${h.s.k} structural dimensions　aligned ${h.s.k-h.s.conf}/${h.s.k}　strength ${(h.s.cos*100).toFixed(0)}%</div>
        ${best?`<div style="font-size:12px;color:#999;margin-bottom:4px">The closest single period</div>
        <div style="font-size:15.5px;font-weight:600;margin-bottom:3px">${best.t.n}<span style="font-weight:400;color:#999;font-size:13px">　${best.t.p}　${best.t.pl}</span></div>
        <div style="font-size:13.5px;line-height:1.85;color:#3a3a3a;margin-bottom:10px">${best.t.note}</div>
        ${best.t.kn?`<div style="font-size:12.5px;color:#7a6535;background:#fdfaf1;border-left:2px solid #e6d8ab;padding:8px 11px;border-radius:0 6px 6px 0;line-height:1.8;margin-bottom:12px"><b style="color:#8a6d3b">Same shape as</b>　${best.t.kn}</div>`:''}
        <div style="font-size:12.5px;color:#777;line-height:1.85;margin-bottom:12px">Called itself: ${best.t.s}<br>Scholarly term: ${best.t.sc}</div>`:''}
        ${others.length?`<div style="font-size:12px;color:#999;margin-bottom:6px">Other periods in this family<span style="color:#ccc"> (${D.regimes.filter(x=>x.f===h.f.id).length} in total)</span></div>
        <div style="font-size:13.5px;line-height:1.9">${others.map(x=>`${x.t.n} (${x.t.p}, ${x.t.pl})`).join('<br>')}</div>`:''}
        ${(D.fic||{})[h.f.id]?`<div style="font-size:12px;color:#999;margin:12px 0 6px">The same family in fiction<span style="color:#ccc"> (not history — for comparison only)</span></div>
        <div style="font-size:13px;line-height:1.9;color:#666">${D.fic[h.f.id].map(x=>`${x[0]} → ${x[1]}`).join('<br>')}</div>`:''}
        <div style="font-size:11.5px;color:#bbb;line-height:1.8;margin-top:14px;border-top:1px solid #f0f0f0;padding-top:12px">
          Only the ten dimensions of political structure were compared. Inside a family there remain differences this test cannot see — the standing of religion, ethnic composition, colonial legacy, the character of leaders. This is not “you belong to it”; it is “this set of preferences has actually been implemented, and this is what it looked like”.
        </div>
        ${regimeDetails()}
      </div>`;})()}
    ${partCard()}
    ${probCard()}

    <div class="card"><h3>Your core principles</h3>${coreHtml}${S.marks.length?`<div style="font-size:12.5px;color:#999;margin-top:14px;line-height:1.75;border-top:1px solid #f0f0f0;padding-top:12px">You also chose, on several questions, answers that do not sit on the axis — ${S.marks.join('; ')}. They lean neither way, so they were left out of the diagnosis above.</div>`:''}</div>

    ${layerHtml}

    ${crossHtml}
    ${neutralHtml}
    ${refHtml}

    <div class="card">
      <h3>Save this result</h3>
      <div style="font-size:13px;color:#888;margin-bottom:12px">Copy it as text to keep a record or to send for a check; the share card makes an image instead.</div>
      <button class="btn ghost" style="margin-bottom:10px" onclick="copyResult()">Copy full result</button>
      <button class="btn ghost" style="margin-bottom:10px;margin-left:8px" onclick="makeShareCard()">Share card</button>
      <details style="margin-top:4px"><summary style="font-size:12.5px;color:#999;cursor:pointer;outline:none">Show the full text</summary><pre id="raw" style="margin-top:10px">${buildText(S)}</pre></details>
    </div>

    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn" style="flex:1.2" onclick="backToEdit()">Change answers</button>
      <button class="btn ghost" style="flex:1" onclick="showNav()">Index</button>
      <button class="btn ghost" style="flex:1" onclick="restart()">Start over</button>
    </div>
    ${timeLine()}
    <div style="font-size:11.5px;color:#bbb;line-height:1.8;margin-top:22px;text-align:center">This result describes the distribution of answers only. It is not a diagnosis, it endorses no position, and it states no political claim.</div>
  </div>`;
  window.scrollTo(0,0);
}

function buildText(S){
  const top = S.res[0];
  const noStance = top.c < MIN_COS;
  let t = `[Where You Stand]  build ${VER}\n`;
  if (noStance) t += `No clear political stance (closest shape ${nm(top.n)}, strength ${(top.c*100).toFixed(0)}%, below the 70% threshold)\n`;
  else t += `Closest: ${nm(top.n)} (${top.c.toFixed(3)})\n`;
  const g2 = (S.res.length>1 && S.res[1].c !== null) ? top.r - S.res[1].r : 0;
  const g2c = (S.res.length>1 && S.res[1].c !== null) ? top.c - S.res[1].c : 0;
  t += `Aligned: ${top.s}/${top.k}  match ${(top.r*100).toFixed(0)}%  strength ${(top.c*100).toFixed(0)}%  gap to second: ${(g2*100).toFixed(0)}pp\n`;
  const topA = D.anchors[top.n] || [];
  const DTHR = PARAMS.thr;
  const hardList = S.vec.map((v,i)=>({g:Math.abs(v-(topA[i]||0)), d:D.dims[i], v, a:topA[i]||0, p:(D.poles||[])[i]}))
    .filter(x => x.g >= 1.0 && Math.abs(x.v) >= DTHR && Math.abs(x.a) >= DTHR);
  const gapList = S.vec.map((v,i)=>({d:D.dims[i], v, a:topA[i]||0}))
    .filter(x => Math.abs(x.a) >= 0.6 && Math.abs(x.v) < DTHR);
  const poleName = (h, val) => {
    const pr = h.p || ["negative","positive"];
    return (val < 0 ? pr[0] : pr[1]) + " " + (val >= 0 ? "+" : "") + val.toFixed(1);
  };
  t += `Verdict: ${verdict(top.c, g2, top.r, top.k, hardList.length, g2c)}\n`;
  t += `Opposing: ${hardList.length ? hardList.map(h=>`${h.d} (you ${poleName(h,h.v)}, it ${poleName(h,h.a)})`).join("; ") : "none"}\n`;
  if (gapList.length) t += `It has, you don't: ${gapList.map(g=>g.d).join("; ")} (it takes a clear position, you take none, so these were not counted)\n`;
  const unc = uncovered(S);
  const confTxt = unc.conflicts.filter(c => !meta[c.i]);
  if (confTxt.length) t += `Opposite answers: ${confTxt.map(c=>`${D.dims[c.i]} (${c.items.map(x=>x.q.opts[L.indexOf(x.c)]).join(' / ')})`).join('; ')}
`;
  const careL = unc.neutral.filter(x=>meta[x.i]==='care').map(x=>D.dims[x.i]);
  const ctxL  = unc.neutral.filter(x=>meta[x.i]==='ctx').map(x=>D.dims[x.i]);
  const plainL = unc.neutral.filter(x=>!meta[x.i] && !unc.conflicts.some(c=>c.i===x.i)).map(x=>D.dims[x.i]);
  if (careL.length) t += `Genuinely indifferent: ${careL.join('; ')}
`;
  if (ctxL.length)  t += `Depends on context: ${ctxL.join('; ')}
`;
  if (plainL.length) t += `No clear leaning: ${plainL.length} dimensions (${plainL.join('; ')}), excluded from comparison
`;
  t += `Top five: ${S.res.slice(0,5).map(r=>nm(r.n)+' '+(r.c===null?'—':(r.r*100).toFixed(0)+"%("+r.s+"/"+r.k+")")).join(' / ')}\n`;
  t += `${D.dims.length} dims: ${S.vec.map(v=>v.toFixed(1)).join(',')}\n`;
  if (S.marks.length) t += `Marks: ${S.marks.join('; ')}\n`;
  const TS = timeStats();
  if (TS.total && TS.n) {
    t += `\n[Time]\n`;
    t += `Total ${fmtDur(TS.total)}${TS.idle>60000?` (active ${fmtDur(TS.active)}, away ${fmtDur(TS.idle)})`:''}\n`;
    t += `Mean ${(TS.mean/1000).toFixed(1)}s per question, median ${(TS.med/1000).toFixed(1)}s\n`;
    t += `Fastest Q${TS.fastIdx} ${(tm.q[TS.fastIdx]/1000).toFixed(1)}s; slowest Q${TS.slowIdx} ${(tm.q[TS.slowIdx]/1000).toFixed(1)}s\n`;
    t += `Under 2s: ${TS.fast} / ${TS.n} (${Math.round(TS.fast/TS.n*100)}%); answers changed: ${TS.changed}\n`;
    t += `Quality: ${TS.verdict}\n`;
    t += `Seconds per question: ${Object.keys(tm.q).sort((a,b)=>a-b).map(k=>`${k}:${(tm.q[k]/1000).toFixed(0)}`).join(' ')}\n`;
  }
  t += `\n[Answers]\n`;
  D.q.forEach(q => {
    if (q.type==='r') {
      const sel = ranking[q.n]||[];
      t += `${q.n}. [${sel.map(i=>L[i]).join('>')||'-'}] orig ${q.o}\n`;
    } else {
      t += `${q.n}.${ans[q.n]||'-'} orig ${q.o}\n`;
    }
  });
  return t;
}

function copyResult(){
  const S = score();
  const txt = buildText(S);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(()=>alert('Copied — paste it to me'));
  } else {
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); alert('Copied');
  }
}

function restart(){
  if(!confirm('Clear all answers and start over?')) return;
  ans={}; ranking={}; meta={}; tie={}; tm={ q:{}, chg:{}, start:0, end:0, idle:0, hiddenAt:0, show:0, last:0 }; cur=-1; localStorage.removeItem('pv4en'); renderCover();
  window.scrollTo(0,0);
}

try {
  if (cur >= TOTAL && Object.keys(ans).length) renderResult(); else render();
} catch (e) {
  try { localStorage.removeItem('pv4en'); } catch (_) {}
  document.getElementById('app').innerHTML =
    '<div style="padding:48px 28px;text-align:center;line-height:2">'
    + '<div style="font-size:18px;font-weight:600;margin-bottom:12px">Something went wrong</div>'
    + '<div style="color:#888;font-size:14px">Probably data left by an older version. Clear it and try again.</div>'
    + '<button onclick="try{localStorage.clear()}catch(e){};location.reload()" '
    + 'style="margin-top:24px;padding:14px 32px;border:0;border-radius:10px;background:#1a1a1a;color:#fff;font-size:16px">Clear and restart</button>'
    + '</div>';
  console.error(e);
}
