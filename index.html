<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Where You Stand</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:#f7f7f8;color:#1a1a1a;line-height:1.65;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:0 0 96px;min-height:100vh;background:#fff}
@media(min-width:700px){body{padding:24px 0}.wrap{border-radius:16px;box-shadow:0 2px 24px rgba(0,0,0,.06);min-height:auto}}


.cover{padding:56px 28px 40px;text-align:center}
.cover h1{font-size:26px;font-weight:600;letter-spacing:.5px;margin-bottom:14px}
.cover .sub{color:#666;font-size:14px;line-height:1.8;margin-bottom:32px}
.cover .meta{display:flex;justify-content:center;gap:28px;font-size:13px;color:#999;margin-bottom:36px}
.cover .meta div{text-align:center}
.cover .meta b{display:block;font-size:20px;color:#1a1a1a;font-weight:600}
.note{background:#f5f5f7;border-radius:12px;padding:18px 20px;font-size:13.5px;color:#555;text-align:left;line-height:1.8;margin-bottom:32px}
.note b{color:#1a1a1a}

.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:500;
background:#1a1a1a;color:#fff;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.ghost{background:#f0f0f2;color:#1a1a1a}
.btn:disabled{opacity:.35;cursor:default}


.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
padding:12px 24px;border-bottom:1px solid #eee}
.bar .row{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:7px}
.track{height:3px;background:#eee;border-radius:2px;overflow:hidden}
.fill{height:100%;background:#1a1a1a;width:0;transition:width .25s ease}


.q{padding:32px 24px}
.q .no{font-size:12px;color:#bbb;letter-spacing:1px;margin-bottom:10px}
.q h2{font-size:17.5px;font-weight:500;line-height:1.7;margin-bottom:26px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:15px 16px;border:1.5px solid #e8e8ea;
border-radius:12px;margin-bottom:11px;cursor:pointer;transition:.12s;background:#fff}
.opt:active{background:#fafafa}
.opt.on{border-color:#1a1a1a;background:#fafafa}
.key{flex:0 0 24px;height:24px;border-radius:50%;background:#f0f0f2;display:flex;align-items:center;
justify-content:center;font-size:12px;font-weight:600;color:#888;transition:.12s}
.opt.on .key{background:#1a1a1a;color:#fff}
.txt{flex:1;font-size:15px;line-height:1.6}


.rank-hint{font-size:12.5px;color:#999;margin-bottom:14px}
.rk{display:flex;align-items:flex-start;gap:14px;padding:15px 16px;border:1.5px solid #e8e8ea;
border-radius:12px;margin-bottom:11px;cursor:pointer;transition:.12s;background:#fff}
.rk.on{border-color:#1a1a1a;background:#fafafa}
.rk .key{background:#f0f0f2}
.rk.on .key{background:#1a1a1a;color:#fff}


.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);
backdrop-filter:blur(10px);border-top:1px solid #eee;padding:12px 24px;max-width:640px;margin:0 auto}
.foot .inner{display:flex;gap:10px}
.foot .btn{flex:1}
.foot .btn.ghost{flex:0 0 88px}


.res{padding:40px 24px}
.res h1{font-size:22px;font-weight:600;margin-bottom:6px}
.res .verdict{font-size:15px;color:#666;margin-bottom:30px}
.card{background:#fafafa;border-radius:14px;padding:22px;margin-bottom:18px}
.card h3{font-size:13px;color:#999;font-weight:500;letter-spacing:.5px;margin-bottom:16px}
.top1{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.top1 .nm{font-size:24px;font-weight:600}
.top1 .sc{font-size:14px;color:#999}
.warn{background:#fff8e6;border:1px solid #ffe0a3;border-radius:10px;padding:14px 16px;
font-size:13.5px;color:#7a5c00;line-height:1.7;margin-top:14px}
.dim{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
.dim .lb{flex:0 0 62px;color:#666;text-align:right}
.dim .tr{flex:1;height:20px;background:#f0f0f2;border-radius:4px;position:relative;overflow:hidden}
.dim .md{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ddd}
.dim .bd{position:absolute;top:3px;bottom:3px;border-radius:2px;background:#1a1a1a}
.dim .vl{flex:0 0 38px;font-size:11px;color:#999;text-align:right}
.rk-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.rk-item:last-child{border:none}
.rk-item .n{color:#666;font-size:12.5px;width:22px}
.rk-item .s{color:#999;font-size:12.5px}
.tag{display:inline-block;padding:4px 11px;background:#eee;border-radius:20px;font-size:12.5px;
margin:0 7px 7px 0;color:#555}
pre{background:#f5f5f7;border-radius:10px;padding:14px;font-size:11.5px;line-height:1.7;
overflow-x:auto;color:#444;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.dim-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.dim-box{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:26px 22px 30px;max-height:82vh;overflow:auto}
.dim-h{font-size:18px;font-weight:600;margin-bottom:14px}
.dim-q{font-size:14px;color:#666;margin-bottom:18px;line-height:1.8;padding-bottom:14px;border-bottom:1px solid #eee}
.dim-side{font-size:14px;line-height:1.9;margin-bottom:14px}
.dim-side b{color:#1a1a1a}
.dim-close{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#1a1a1a;color:#fff;font-size:15px}
.dimhint{font-size:11px;color:#bbb;margin-left:4px}
</style>
</head>

<script>
const D = {"q": [{"n": 1, "o": "1", "d": 1, "t": "A long-standing local custom has been followed for generations. A young newcomer finds it unreasonable and wants it abolished. You lean toward—", "opts": ["If it has lasted this long it must have its reasons; don't touch it lightly", "First ask why it existed; if that reason is gone, change it", "The people living there should vote on it", "Look at what it actually produces; keep what works, drop what doesn't", "There is no general answer; every community decides for itself", "Its justification isn't ours to judge — we have no standing to rule on it"], "type": "s"}, {"n": 2, "o": "18", "d": 1, "t": "A widely respected elder says: “Some rules need no reason. Being handed down is the reason.” Your reaction—", "opts": ["Agree. That wisdom is accumulated trial and error across generations", "Disagree. Every rule should be able to state its reason", "What matters is who has the authority to change it", "Whether it still works now", "He has his reasons, I have mine. No need to argue", "Some things were never ours to govern. Asking “why” is already the wrong question"], "type": "s"}, {"n": 3, "o": "3", "d": 2, "t": "An old industrial district is being redeveloped. Nearly all residents have accepted compensation and moved out; three households refuse. You lean toward—", "opts": ["For the common good, eminent domain is lawful if compensation is fair", "No coercion. If three refuse, it cannot be cleared", "Raise the compensation until they agree voluntarily — but never force", "Let a court decide; once due process ends, enforce it", "Let them negotiate directly with the developer; the government stays out"], "type": "s"}, {"n": 4, "o": "20", "d": 2, "t": "Someone says: “Without the collective, the individual is nothing.” Your reaction—", "opts": ["Mostly agree. All our capacities, language and meaning come from society", "Disagree. Society is man-made, and people can remake it", "Partly. But a collective is legitimate only if individuals authorize it", "Depends which collective. Family and state are not the same thing"], "type": "s"}, {"n": 5, "o": "6", "d": 3, "t": "Looking back over the past thirty years, what brought about the biggest changes?", "opts": ["Policy and the key choices of decision-makers", "Advances in technology and modes of production", "A few unforeseeable events that happened to converge", "The accumulated daily effort of countless ordinary people", "Changes in the external environment; we only reacted", "Both are at work; I can't separate them"], "type": "s"}, {"n": 6, "o": "30", "d": 3, "t": "A company made one key decision ten years ago — a pivot into a new business, say. Its trajectory since then is completely different. You think—", "opts": ["That decision was decisive. A different one and it would be another company", "Not much difference. Once the industry trend arrives, someone will make it work", "It would differ, but the broad direction is set by the industry", "The counterfactual is meaningless"], "type": "s"}, {"n": 7, "o": "9", "d": 4, "t": "Faced with a genuinely new problem — online fraud, say, or platforms taking an ever-larger cut — the best response is—", "opts": ["Pass a new law and create a new agency for it", "Stretch existing law by interpretation and muddle through", "Solve it at the source with technology, not by stacking up institutions", "Leave it. Many new problems dissolve as technology and habits change", "Don't intervene. Let the industry form its own rules", "Accept that it is unsolvable; just contain the damage"], "type": "s"}, {"n": 8, "o": "22", "d": 4, "t": "Can a whole body of rules — a local charter, a family code — be designed in advance?", "opts": ["Yes, if designed well enough", "The framework can be; details only emerge in practice", "Not as a whole. Only piecemeal revision works", "The more you design, the worse it gets. Good rules grow slowly"], "type": "s"}, {"n": 9, "o": "14", "d": 5, "t": "A child steals. The family is very poor. You think—", "opts": ["Circumstances did it. In another environment he would be a good kid", "Poverty is no excuse. Greed is in everyone", "It depends whether he was taught. Teaching can change him", "Don't discuss causes; discuss what to do", "It depends on what he himself thinks"], "type": "s"}, {"n": 10, "o": "26", "d": 5, "t": "“If resources were unlimited, would people still fight?”", "opts": ["No. All conflict is scarcity", "Yes. People fight over more than resources", "Yes, but in different forms", "Can't imagine it"], "type": "s"}, {"n": 11, "o": "N5", "d": 6, "t": "You support a position. What matters most is—", "opts": ["It accords with the objective laws of development; it will arrive sooner or later", "It has been proven to work in practice", "It is morally right — worth pursuing even if never realized", "It is what our ancestors always did", "Can't say; it just feels right"], "type": "s"}, {"n": 12, "o": "N6", "d": 6, "t": "A perfectly just society with no poverty may never be achievable. Is it worth fighting for?", "opts": ["Yes. Hold to it even if everyone opposes", "No. Unreachable ideals kill people", "As a direction, yes; as a blueprint, no", "It depends whether the struggle harms people alive now", "Too abstract to answer"], "type": "s"}, {"n": 13, "o": "N1", "d": 7, "t": "Rents in a city have risen three years straight; young people can no longer afford to rent. You think—", "opts": ["The government should cap rents", "The government should build a great deal of public housing", "The government should subsidize renters", "No intervention. Rising prices mean insufficient supply; the market will adjust", "That's the market. Nothing to be done"], "type": "s"}, {"n": 14, "o": "N2", "d": 7, "t": "“If an industry is fully liberalized, prices will find their own level.” Your reaction—", "opts": ["Agree. Price is the best signal", "Disagree. Housing, healthcare and education cannot be left entirely to the market", "Broadly agree, but guard against monopoly", "It depends whether the costs get pushed onto others", "This kind of theorizing is pointless"], "type": "s"}, {"n": 15, "o": "7", "d": 8, "t": "A household in the neighborhood lets garbage pile up at its door, bothering everyone. You think—", "opts": ["The community should compel cleanup, with fines if needed", "The community can only persuade, not compel", "The neighbors can sue", "It is his business. Others have no say", "The community should pay to clean it up"], "type": "s"}, {"n": 16, "o": "31", "d": 8, "t": "Someone says: “The less a residential block is managed, the better it is to live in.” Your reaction—", "opts": ["Agree. More management means more trouble", "Disagree. Without management it falls apart", "Depends what. Safety and sanitation, yes; the rest, no", "Not how much, but who manages and how", "Either way it costs money; the question is where it comes from"], "type": "s"}, {"n": 17, "o": "2", "d": 9, "t": "Several towns are to share one waste facility; the siting has been disputed for six months. You lean toward—", "opts": ["Central planning picks the lowest total-cost site", "Each town decides whether to join; those that opt out handle it themselves", "Central planning, but any affected town holds a veto", "Central planning, with siting set by an independent technical body", "Let bidding decide: whoever accepts it gets compensated", "Affected residents negotiate directly with the builder — deal or no deal"], "type": "s"}, {"n": 18, "o": "28", "d": 9, "t": "In a large organization, regional branches differ enormously. Headquarters should—", "opts": ["Set uniform rules, or it spins out of control", "Set only the floor; the rest is decided locally", "Devolve everything and assess results only", "Delegate in proportion to each branch's capacity", "There should be no headquarters at all"], "type": "s"}, {"n": 19, "o": "12", "d": 10, "t": "Dozens of small shops on one street want to negotiate wholesale prices together. The most effective approach is—", "opts": ["The street office or market authority negotiates on their behalf", "They elect a few representatives to negotiate", "Hire a knowledgeable lawyer or broker to negotiate", "Organize themselves: buy together, split together", "No organization; each shop fends for itself", "Vote to authorize a professional to negotiate"], "type": "s"}, {"n": 20, "o": "24", "d": 10, "t": "“Organized groups defend themselves better than scattered individuals.” You think—", "opts": ["Agree. Organization is necessary", "Disagree. Organizing just hands control to a few", "Depends. Nonprofit and for-profit are entirely different", "Organize, but no paid officials — they turn bureaucratic", "Better to introduce outside competition and let providers undercut each other", "Organize without paid officials, and add outside competition to force prices down"], "type": "s"}, {"n": 21, "o": "37", "d": 11, "t": "A school brings in an outside principal. He runs things strictly and lifts exam results, but he was not promoted from within and the teachers had no part in choosing him. Is he legitimate?", "opts": ["Yes. Competence and results are the qualification", "No. He was not chosen by the staff, so results don't make it legitimate", "Let him serve, with regular review and a way to remove him", "As long as he is decent and doesn't torment the teachers", "It depends whether the teachers accept him"], "type": "s"}, {"n": 22, "o": "38", "d": 11, "t": "A workshop gets a new director. Meetings were held, questions asked, reports filed — but output and morale do not improve. You think—", "opts": ["Following procedure is enough; the outcome is not all on him", "Procedure followed with no effect means the procedure itself is faulty", "Hold someone accountable — for poor execution", "Replace him, but through proper procedure", "That workshop is simply hard to run. Not his fault"], "type": "s"}, {"n": 23, "o": "N4", "d": 11, "t": "“If the procedure was correct, a bad outcome should still be accepted.” Your reaction—", "opts": ["Agree. Procedure is the only reliable thing", "Disagree. A bad outcome means the procedure is faulty", "Depends how bad", "What matters is whether the procedure itself is genuinely fair", "Procedure is form; results are what count"], "type": "s"}, {"n": 24, "o": "N3", "d": 12, "t": "A mayor is elected and hugely popular, but in several years has built no road and finished nothing. You think—", "opts": ["He was elected; let him serve out the term", "Start a recall and let the voters decide again", "Higher-level government should replace him", "Nothing got done, but it is not entirely his fault", "The voters chose badly; they wait for next time"], "type": "s"}, {"n": 25, "o": "N9", "d": 12, "t": "Who should decide who heads a department?", "opts": ["Appointed from above. He answers upward, not to popularity below", "Elected by the department. He answers to them", "Nominated from above, confirmed by a vote of the members", "Appointed from above, but members can remove him mid-term", "Whoever decides, competence is what matters"], "type": "s"}, {"n": 26, "o": "16", "d": 13, "t": "Your local community organization has run the same way for over a decade and everyone is used to it. Someone now proposes an overhaul: change the management, re-elect people, rewrite the rules. You lean toward—", "opts": ["It is fine as it is. No need to stir things up", "Some things should change, but there is no need to tear it all down", "Overhaul it now, while there is still consensus", "Fine, but first say exactly what it becomes", "Change it however, as long as it doesn't affect me"], "type": "s"}, {"n": 27, "o": "29", "d": 13, "t": "Someone says: “An organization that hasn't changed in three years is already dead.” Your reaction—", "opts": ["Agree. Standing still is falling behind", "Disagree. Stability is itself a value", "Depends. Some things should stay stable", "The direction matters, not whether it changes", "Either way a few people decide. Not my business"], "type": "s"}, {"n": 28, "o": "4", "d": 14, "t": "A city government is scrapping a decades-old policy. Two options: pilot it in a few districts first, or change everything at once — better one sharp pain than a prolonged ache. You lean toward—", "opts": ["Pilot first. Safer", "Change it all at once; dragging it out only makes it worse", "Pilot first, with a firm rollout timetable", "Change now, but leave a way to reverse and adjust", "Either way; it depends who is pushing"], "type": "s"}, {"n": 29, "o": "33", "d": 14, "t": "Gradual reform or radical reform — which do you lean toward?", "opts": ["Gradual is more reliable. Radical reforms fail more often", "Radical is thorough. Gradual ends up changing nothing", "Depends on the issue. Some can wait, some cannot", "Not speed, but direction", "Pointless. In reality we are all pushed along"], "type": "s"}, {"n": 30, "o": "11", "d": 15, "t": "The road outside your home has been broken for years and nobody fixes it. What is most likely to get it fixed?", "opts": ["One capable person taking the lead", "Everyone speaking up and pressing together", "The existing authority acting on its own initiative", "An outside professional body stepping in", "Wait for conditions to mature; it resolves itself"], "type": "s"}, {"n": 31, "o": "23", "d": 15, "t": "“Change is always driven by a minority.” Your reaction—", "opts": ["Agree. The majority only follows", "Disagree. Change without majority participation does not hold", "A minority initiates; the majority decides whether it succeeds", "What matters is whether institutions let the majority take part", "Nothing can be changed"], "type": "s"}, {"n": 32, "o": "5", "d": 16, "t": "You need someone to look after your house for a few days. Whom do you ask first?", "opts": ["Relatives or people from my hometown — blood is thicker", "A neighbor I have known for years", "A professional agency with a proper contract", "Order through a platform with ratings and insurance", "Whoever is cheapest"], "type": "s"}, {"n": 33, "o": "19", "d": 16, "t": "“In a team, good relationships matter most; rules are secondary.” Your reaction—", "opts": ["Agree. With the right people, anything works", "Disagree. Clear rules are what protect relationships", "Both, but relationships are the foundation", "Both, but rules are the foundation", "Depends on size. Small teams run on relationships, large ones on rules"], "type": "s"}, {"n": 34, "o": "15", "d": 17, "t": "A stranger far away and your neighbor face the same hardship. Your responsibility to them is—", "opts": ["Identical. Both are human", "Neighbor first, but the stranger cannot be abandoned", "Only the neighbor. The distant is out of reach", "Neither. That is the government's job", "Whoever needs it more", "Individuals cannot reach that far. Public institutions should carry it"], "type": "s"}, {"n": 35, "o": "27", "d": 17, "t": "“Moral obligation has boundaries; it fades with distance.” Your reaction—", "opts": ["Agree. That is human nature", "Disagree. Duty should not change with distance", "Feeling fades; duty should not", "The boundary is not distance, it is relationship", "Duty talk is empty; look at actual capacity"], "type": "s"}, {"n": 36, "o": "8", "d": 18, "t": "A new technology could greatly boost efficiency, but it requires concentrating a great deal of personal data in one place. Your first thought—", "opts": ["Technology is a tool; who uses it is what matters", "The technology itself locks in a power structure", "Technology drives social change; nobody can stop it", "Some technologies should not be used even if beneficial", "Use it first, adjust if problems arise"], "type": "s"}, {"n": 37, "o": "21", "d": 18, "t": "“Tools are just tools. Guns don't kill people; people do.” Your reaction—", "opts": ["Agree. Responsibility is always with people", "Disagree. Some tools' design shapes their use", "Partly. But tools change people's habits", "Depends on the tool. Guns are made to kill, buckets to hold things — not the same", "Pointless. Look at outcomes"], "type": "s"}, {"n": 38, "o": "13", "d": 19, "t": "A new technology has uncertain long-term consequences but large short-term benefits. Regulation should—", "opts": ["Require proof of long-term safety before rollout", "Allow first, regulate when problems appear", "Stricter where health and safety are involved, looser elsewhere", "No uniform regulation; let users and markets judge", "It depends on reversibility: if it can be undone, go; if not, wait"], "type": "s"}, {"n": 39, "o": "25", "d": 19, "t": "“Better slow than wrong.” Your reaction—", "opts": ["Agree. Some mistakes cannot be made", "Disagree. Without risk nothing gets done", "Depends whether the error is recoverable", "What matters is who bears the cost", "Being slow is itself an error"], "type": "s"}, {"n": 40, "o": "10", "d": 20, "t": "Your town wants a new water system, but it needs the neighboring town's cooperation. Your approach—", "opts": ["Bring in everyone I can, even old rivals", "Work only with those on good terms with us", "Whoever benefits from this, regardless of the future", "Ask nobody. Do it ourselves", "Depends. No fixed strategy"], "type": "s"}, {"n": 41, "o": "32", "d": 20, "t": "“Today's friend may be tomorrow's rival.” Your reaction—", "opts": ["Agree. So never close the door", "Disagree. Flip-flop and nobody trusts you", "Depends. Some things can be conceded, some cannot", "Shared interests matter, not personal ties", "I don't play these games"], "type": "s"}, {"n": 42, "o": "N7", "d": 21, "t": "You believe something is true. Your ultimate ground is—", "opts": ["God or Providence says so", "It accords with a cosmic order; things ought to be this way", "It follows the laws of historical development", "It follows natural law, and humans are part of nature", "There is always a point where “why” stops. You just accept it", "You can keep asking forever. There is no bottom", "Eventually it loops back to the original question"], "type": "s"}, {"n": 43, "o": "N8", "d": 21, "t": "Setting textbooks aside, by intuition: the world is—", "opts": ["Arranged by some being with a will", "Governed by objective law, but purposeless and unresponsive", "Without inherent order; order is invented", "Can't say"], "type": "s"}, {"n": 44, "o": "V1", "d": 22, "t": "How much should outsiders know about how your organization spends money?", "opts": ["Publishing the totals and categories is enough", "Results public, and every discussion on record — retrievable on request", "Everything public; anyone can question any item", "No disclosure. Decided internally, executed faster", "Disclosure is theater. It changes nothing"], "type": "s"}, {"n": 45, "o": "V2", "d": 22, "t": "“As long as the outcome is good, it does not matter if the process is not public.” Your reaction—", "opts": ["Agree. Results matter most", "Disagree. Without disclosure, errors cannot be corrected", "Depends. Classified matters can be exceptions", "What matters is whether an independent party can investigate", "Disclosure is performance. It changes nothing"], "type": "s"}, {"n": 46, "o": "W1", "d": 23, "t": "In a small town, both the elected local council and a group of respected family elders can make decisions. A single matter has stalled for three months. The root cause is—", "opts": ["Two deciders was the mistake. One should have the final say", "There is no mechanism for final adjudication", "There is no pressure forcing them to reach agreement", "Not a problem. Deadlock means both sides still have a case", "Both have a point; forcing unity was wrong from the start"], "type": "s"}, {"n": 47, "o": "W2", "d": 23, "t": "Someone says: “Concentrated power will always rot.” Your reaction—", "opts": ["Mostly agree. Dispersion and checks are the only remedy", "True, but dispersion means nobody is responsible", "Not necessarily. It is who holds power, not how it is spread", "Disagree. Dispersion is itself a rot — nobody answers for anything", "Depends"], "type": "s"}, {"n": 48, "o": "W3", "d": 23, "t": "A city wants to build a road requiring land from three surrounding towns. All three refuse. You think—", "opts": ["The city should have final authority in the city's interest", "The regional government should adjudicate", "Keep negotiating until all three agree", "If any town refuses, there is no road", "Change the plan and route around them"], "type": "s"}, {"n": 49, "o": "X1", "d": 24, "t": "A multinational evades taxes in several countries. Who should handle it?", "opts": ["Each country legislates for itself", "Countries set rules jointly", "A world body should regulate it", "Cannot be handled. It is inherent to globalization", "Close our own loopholes first; forget the others"], "type": "s"}, {"n": 50, "o": "X2", "d": 24, "t": "“A country's problems can only be solved by its own people.” Do you agree?", "opts": ["Agree. Outsiders only make it worse", "Broadly, but severe humanitarian crises warrant intervention", "Disagree. Many problems were caused from outside to begin with", "Disagree. Suffering has no borders; whoever sees it should act", "Depends"], "type": "s"}, {"n": 51, "o": "X3", "d": 24, "t": "When you say “we”, what comes to mind first?", "opts": ["My country", "My region or city", "People in my situation, wherever they live", "Humanity", "I don't use the word much"], "type": "s"}, {"n": 52, "o": "17", "d": 0, "t": "A road is to be built right past your door. More noise, much easier travel. What do you base your judgment on?", "opts": ["Fair compensation and no health impact, and I accept", "No amount of compensation. This is my home", "Whether it is better overall", "Let everyone vote; my own view does not matter", "I will not accept the impact on my life, but I will not stop others from accepting it"], "type": "s"}, {"n": 53, "o": "34", "d": 0, "t": "Do you actively follow policy, public issues or social news?", "opts": ["Almost every day", "When something big happens", "Occasionally, in passing", "Rarely", "I avoid it deliberately"], "type": "s"}, {"n": 54, "o": "35", "d": 0, "t": "“How much influence can someone like me have on public affairs?”", "opts": ["A lot. Participation changes outcomes", "A little, at least in small matters", "Very little, but one should still speak", "None. It is all decided above", "It is not about whether I can. I don't care"], "type": "s"}, {"n": 55, "o": "36", "d": 0, "t": "“Will decision-makers respond to ordinary people's demands?”", "opts": ["Yes, the channels work", "Sometimes, depending on the issue", "Rarely, unless it blows up", "No. Only those with power get answers", "Never thought about it"], "type": "s"}, {"n": 56, "o": "39", "d": 0, "t": "You receive an instruction from your superior that you believe violates the rules — “technical adjustments” to a report, say. Your first reaction—", "opts": ["Comply. The responsibility is not mine; I follow orders", "Comply, but leave a paper trail and explain later", "Raise my concerns first; comply if overruled", "Refuse, and state why", "Refuse and report it to the oversight body", "Make it public"], "type": "s"}, {"n": 57, "o": "40", "d": 0, "t": "An EV maker expands on continuous borrowing. Sales grow fast but it never turns a profit. Then the industry cools and its cash flow snaps. In hindsight, what most needs asking? (Choose several — rank by importance)", "opts": ["Who approved the expansion? Was the decision process followed", "Where did the money go? Why was the finance opaque", "Did shareholders and employees know when the borrowing happened", "Why did board and supervisory oversight fail", "Why did banks and investors dare to lend", "There was never any mechanism that could have stopped it", "Any CEO would have done the same; the problem is how the whole industry operates"], "type": "r"}, {"n": 58, "o": "41", "d": 0, "t": "A technology could make your child smarter and healthier from birth, but only a few can afford it. You lean toward—", "opts": ["Ban it. It creates irreversible division", "Allow it, with public funding so everyone can afford it", "Allow it. It is a personal choice", "Allow it for treatment only, not enhancement", "Don't care"], "type": "s"}, {"n": 59, "o": "42", "d": 0, "t": "What is the essential relationship between different countries and groups?", "opts": ["Competition. Only power protects you", "Rules and cooperation can produce mutual gain", "Friend or foe depends on perception, and can change", "Too remote to concern me", "Can't say"], "type": "s"}, {"n": 60, "o": "43", "d": 0, "t": "Your organization is rolling out a reform that will, in the short term, weaken your department's power and resources.", "opts": ["Support it. Overall efficiency matters more", "Support it, but negotiate a reasonable transition", "Support it outwardly, stall in practice", "Oppose it openly, with reasons", "Say nothing and see which way it goes"], "type": "s"}, {"n": 61, "o": "44", "d": 0, "t": "Someone says: “Social problems get solved one by one; it just takes time.” Your reaction—", "opts": ["Agree. Problems are finite — solve one and there is one fewer", "Broadly agree. Old problems give way to new ones, but on the whole it improves", "Not quite. Problems never run out; they only change form", "Disagree. Some problems are unsolvable; all you can do is ease the pain"], "type": "s"}], "anchors": {"Anarcho-communism": [-0.5, 0.0, 0.5, 0.7, -0.9, 0.0, -0.9, 1.0, 0.9, 0.9, -0.5, 0.9, 0.9, 0.9, 0.9, 0.0, 0.8, 0.0, 0.5, -0.8, 0.7, 0.9, 1.0, -0.5], "Anarcho-individualism": [-0.8, 1.0, 0.5, 0.9, 0.0, 0.5, 0.8, 1.0, 1.0, 0.5, -0.5, 0.5, 0.7, 0.8, 0.8, 0.6, 0.5, 0.0, 0.5, 0.9, 0.0, 0.5, 1.0, 0.0], "Maoism": [0.5, -0.9, -0.8, -0.7, -0.9, -0.9, -1.0, -0.9, -0.8, -0.7, 0.5, 0.0, 0.9, 0.9, 0.5, -0.5, 0.5, 0.5, 0.5, -1.0, 0.0, -0.5, -0.7, 0.6], "Social Democracy": [-0.5, 0.0, 0.0, -0.5, -0.5, 0.0, -0.8, 0.5, -0.5, 0.5, 0.0, 0.7, 0.5, -0.9, 0.5, 0.5, 0.5, -0.5, -0.5, 0.0, 0.0, 0.7, 0.5, -0.5], "Social Liberalism": [-0.7, 0.5, -0.5, -0.6, 0.
