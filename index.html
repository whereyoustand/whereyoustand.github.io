rder"], ["Collectivism", "Individualism"], ["Voluntarism", "Determinism"], ["Constructivism", "Spontaneous Order"], ["Human Perfectibility", "Original Sin"], ["Historicism", "Normativism"], ["Interventionism", "Laissez-Faire"], ["Paternalism", "Liberty"], ["Centralization", "Decentralization"], ["Corporatism", "Pluralism"], ["Proceduralism", "Consequentialism"], ["Appointment", "Electoral Accountability"], ["Status Quo", "Reform"], ["Reformism", "Revolutionism"], ["Vanguardism", "Spontaneism"], ["Gemeinschaft", "Gesellschaft"], ["Particularism", "Universalism"], ["Instrumentalism", "Substantivism"], ["Precautionary", "Proactionary"], ["Coalition-building", "Transactionalism"], ["Personal God", "Impersonal Order"], ["Arcana Imperii", "Publicity"], ["Unitary", "Pluralist"], ["Internationalism", "Nationalism"]], "marks": {"12": {"E": "no organization; each household on its own"}, "24": {"B": "organization protects people, but a few will capture it"}, "N7": {"E": "there is a starting point that needs no further why", "F": "you can keep asking, with no end", "G": "eventually it loops back to the beginning"}}, "methodAnchors": ["Utilitarianism", "Nietzscheanism"], "info": {"Anarcho-communism": {"one": "No state, no private property — voluntary communes and distribution by need.", "figures": "Kropotkin; Makhno; the CNT-FAI in Spain", "tenets": ["Abolish the state and private property", "A federation of communes, direct democracy", "From each according to ability, to each according to need"], "misread": "That anarchy means chaos. What it proposes is order without rule — self-organization and mutual aid instead of command.", "read": "Kropotkin, *The Conquest of Bread*; *Mutual Aid*", "history": "Proudhon raised “property is theft” in the 1840s, but the current took shape after Bakunin split with Marx in the 1870s. Kropotkin's *Mutual Aid* (1902) argued from biology that cooperation is more natural than competition. Its practical peak was Catalonia in the Spanish Civil War — the CNT-FAI ran workers' self-management and collective farms until Franco crushed it in 1939. Since then it has existed mainly as an intellectual tradition, feeding the autonomist movements after 1968 and the Zapatista uprising in 1994."}, "Anarcho-individualism": {"one": "Individual sovereignty is inviolable; no collective — not even a commune — may compel you.", "figures": "Stirner; Thoreau; Benjamin Tucker", "tenets": ["The individual is the only reality", "Association must be voluntary and exitable at will", "Against all coercion, including the coercion of capital"], "misread": "That it equals anarcho-capitalism. The difference: it opposes all coercion, including an employer's.", "read": "Stirner, *The Ego and Its Own*", "history": "Stirner's *The Ego and Its Own* (1844) is the starting point: “I care only for myself.” Thoreau's *Civil Disobedience* (1849) supplied a practice — refuse taxes, refuse unjust law. The American Benjamin Tucker spread it through the journal *Liberty*. Unlike anarcho-communism it does not require collective ownership: individuals may hold property, so long as they do not coerce others."}, "Maoism": {"one": "Pushes human agency to its limit — trust the masses, distrust the bureaucracy.", "figures": "Mao Zedong", "tenets": ["The countryside surrounds the city", "Continuous revolution: repeatedly strike the bureaucracy", "A blank slate is the best material for the newest picture"], "misread": "That it is merely Chinese Marxism-Leninism. Its hostility to its own bureaucracy is unique within the Marxist-Leninist family.", "read": "*On Practice*; *On Contradiction*; *Report on an Investigation of the Peasant Movement in Hunan*", "history": "In the 1920s Mao arrived in practice at “the countryside surrounds the city”, against the Comintern's city-centred line. It became a system at Yan'an in the 1930s (*On Practice*, *On Contradiction*). After 1949 he broke with Moscow in the late 1950s over revisionism, then launched the Cultural Revolution in 1966 — continuing revolution, repeatedly assaulting the bureaucracy. In the 1970s it was exported to Southeast Asia and Latin America; Peru's Shining Path was its most extreme variant."}, "Social Democracy": {"one": "Don't overthrow capitalism — use the ballot and the welfare state to make it more equal.", "figures": "Eduard Bernstein; the Swedish Social Democrats; the Nordic model", "tenets": ["The parliamentary road, not revolution", "Welfare state and redistribution", "Collective bargaining and class compromise"], "misread": "That it is mild communism. It abandoned public ownership and revolution long ago; it is reform from within capitalism. Nor is it the same as “democratic socialism” — Sanders and Corbyn still want to go beyond capitalism; social democrats only want to make it gentler.", "read": "Bernstein, *Evolutionary Socialism*", "history": "The name has changed three times. In the mid-19th century “social democracy” was used interchangeably with scientific socialism; in 1899 Bernstein's *Evolutionary Socialism* turned it reformist; the 1951 Frankfurt Declaration renamed it “democratic socialism”; after 1989 it reverted to “social democracy” to distance itself from “actually existing socialism”. Organisationally: the German SPD's Erfurt Programme (1891) still sounded revolutionary; Bad Godesberg (1959) formally dropped public ownership and accepted market competition. Sweden's Saltsjöbaden Agreement (1938) institutionalized bargaining into the Nordic model — high taxes, high benefits, strong unions, open markets. Postwar Britain's Labour built the NHS. Stagflation in the 1970s exposed the fiscal strain; the 1990s turned to the “social investment state” (Giddens, Blair)."}, "Social Liberalism": {"one": "A free market is fine, but the weakest must be able to live in it.", "figures": "Rawls; Keynes; the American Progressive movement", "tenets": ["Liberty first, but redistribution is permitted", "The difference principle: inequality is justified only if it benefits the worst off", "The state guarantees a floor"], "misread": "That it is centrist fence-sitting. It has a firm principle — liberty is not tradable, but every inequality must be justified.", "read": "Rawls, *A Theory of Justice*", "history": "Britain's “new liberalism” at the end of the 19th century (Green, Hobhouse) argued that liberty needs material conditions — without education and a minimum income, free speech is empty. The Keynesian revolution of the 1930s showed markets cannot guarantee full employment. The Beveridge Report (1942) drew the blueprint of the welfare state. Rawls's *A Theory of Justice* (1971) gave redistribution a philosophical argument through the veil of ignorance: not knowing which family you would be born into, you would agree to rules protecting the weakest. It was institutionalized across the West after the war, questioned after the stagflation of the 1970s, and partly reconciled with efficiency through the “Third Way” of the 1990s."}, "Religious Socialism": {"one": "Use the ethical demands of faith to support economic equality.", "figures": "Gustavo Gutiérrez; liberation theology; some Islamic socialists", "tenets": ["Poverty is itself an injustice", "Property carries social obligations", "Faith demands transforming this world, not merely comforting it"], "misread": "That religion is necessarily conservative. Liberation theology was a source of left-wing movements in Latin America.", "read": "Gutiérrez, *A Theology of Liberation*", "history": "Christian socialism appeared in Britain at the end of the 19th century (Maurice, Kingsley), trying to reconcile faith with social reform. Latin American liberation theology was its height — Gutiérrez's *A Theology of Liberation* (1971) held that God takes the side of the poor, and in 1970s Nicaragua priests served in the revolutionary government. The Islamic world had its own Islamic socialism in 1950s Indonesia and Egypt."}, "Liberalism": {"one": "Individual rights come first; state power must be limited and divided.", "figures": "Locke; Mill; Montesquieu", "tenets": ["Rule of law and separation of powers", "Freedom of speech, association and worship", "The state is a necessary evil"], "misread": "That liberalism means laissez-faire economics. Classical liberalism did include it, but modern liberalism supports intervention.", "read": "Mill, *On Liberty*", "history": "Locke's *Two Treatises* (1690) established natural rights and consent. Montesquieu's *The Spirit of the Laws* (1748) proposed the separation of powers. Mill's *On Liberty* (1859) drew the boundary of individual freedom: it may be restricted only where it harms others. The 19th century was liberalism's golden age and its split — economically toward laissez-faire, politically toward universal suffrage. In the 20th century it divided formally into classical liberalism (market) and social liberalism (redistribution)."}, "Libertarianism": {"one": "If it harms no one else, the state should stay out of it entirely.", "figures": "Nozick; Rothbard; Hayek", "tenets": ["Self-ownership", "The minimal state (or none)", "Markets solve most coordination problems"], "misread": "That it equals anarchism. Most libertarians accept a night-watchman state limited to security and contract.", "read": "Nozick, *Anarchy, State, and Utopia*", "history": "A 20th-century product. Hayek's *The Road to Serfdom* (1944) warned that planning leads to totalitarianism. Rothbard developed anarcho-capitalism in the 1970s. Nozick's *Anarchy, State, and Utopia* (1974) argued through entitlement theory that any redistribution beyond the night-watchman state violates individual rights. Since the 1970s it has influenced American politics (the Tea Party, the Libertarian Party) but has never become a governing majority."}, "Conservatism": {"one": "Not opposed to change, but opposed to rebuilding society from a blueprint.", "figures": "Burke; Oakeshott; Scruton", "tenets": ["Tradition carries a wisdom that cannot be fully stated", "Change should be gradual and organic", "Abstract principles are dangerous"], "misread": "That conservatism means stubborn reaction. Burke supported the American Revolution; what he opposed was the rational reconstruction of France.", "read": "Burke, *Reflections on the Revolution in France*", "history": "Burke's *Reflections* (1790) is the starting point: against rebuilding society on abstract reason, for society as “a partnership between generations”. In 19th-century Europe conservatism allied with monarchy and church. American neoconservatism (from the founding of *National Review* in 1955) shifted toward anti-communism and a hard foreign policy. Britain has a separate “One Nation” tradition, arguing that elites owe a duty to those below — unlike American neoconservatism."}, "Communitarianism": {"one": "People are not atoms; rights cannot be detached from the goods of a community.", "figures": "MacIntyre; Sandel; Taylor", "tenets": ["The self is shaped by community", "Rights must be discussed within a conception of the common good", "Against the “unencumbered self”"], "misread": "That it equals collectivism. It does not deny individual rights, only the idea that rights can be discussed apart from society.", "read": "MacIntyre, *After Virtue*", "history": "It emerged in the 1980s as a reply to Rawls. MacIntyre's *After Virtue* (1981) criticized modern moral philosophy for losing the tradition of practice. Sandel's *Liberalism and the Limits of Justice* (1982) attacked the unencumbered self. Taylor emphasized the politics of recognition. It was philosophically influential but never became a party — its claims are largely negative (against atomization) and lack a full institutional programme."}, "Authoritarian Fascism": {"one": "The state — or the nation, or the leader — is the highest end; individuals are material.", "figures": "Mussolini; Hitler; the Japanese military command", "tenets": ["The leadership principle", "A total state penetrating everything", "Myth and will in place of reasoned debate"], "misread": "That it is extreme conservatism. It is revolutionary — it wants to smash the old order and build a new man.", "read": "Arendt, *The Origins of Totalitarianism* (read critically)", "history": "Mussolini founded the Fasci di Combattimento in 1919 — fasces, the bundle of rods, being the symbol of authority — and seized power by marching on Rome in 1922. The Nazis took power in 1933. Japan was run by the military from the 1930s: imperial institution plus militarism. The three signed the Tripartite Pact in 1940. Destroyed as organizations after defeat, the current reappears in new forms. Scholarship usually distinguishes three types: Italian state-worship, German racism, Japanese imperial militarism."}, "State Capitalism": {"one": "The state runs the economy like a board of directors; the market is a tool, not an end.", "figures": "Park Chung-hee; Singapore's Temasek model; China in the reform era", "tenets": ["The state leads industrial upgrading", "Keep the market but control the commanding heights", "Efficiency before procedure"], "misread": "That it is a planned economy. It uses market instruments heavily; ownership and control simply stay with the state.", "read": "Schumpeter, *Capitalism, Socialism and Democracy*", "history": "Not Marx's term — he used it for the “final stage of capitalism”. In the 20th century it described the Soviet NEP (1921–28), the Nazi economy, the East Asian developmental states (Korea and Singapore after 1961), and post-reform China. Schumpeter's *Capitalism, Socialism and Democracy* (1942) gave the theorization. Its core feature: the state as largest shareholder and planner, while market exchange and wage labour remain."}, "Technocracy Movement": {"one": "Let engineers run society by efficiency, with energy units replacing prices.", "figures": "Veblen; Howard Scott; Technocracy Inc.", "tenets": ["Engineers know how to raise efficiency, but businessmen hold the decisions", "Businessmen restrict output to keep prices up — “destructive production”", "Replace money with energy certificates; measure the economy in joules", "Parliaments and parties cannot handle technical problems"], "misread": "That it means “rule by experts” or technocratic administration. It is more radical — it wants to abolish the price system itself, not just give experts more say. Nor is it confined to the 1930s: Veblen's *The Engineers and the Price System* (1921) is its theoretical source.", "read": "Veblen, *The Engineers and the Price System* (1921); Technocracy Inc., *Technocracy Study Course* (1934)", "history": "William Henry Smyth coined “technocracy” in 1919. Veblen proposed a “soviet of technicians” in 1921. In 1932 Howard Scott founded Technocracy Inc. at Columbia — uniforms, insignia, membership cards: the only time technocracy became a mass movement. It proposed energy certificates and the abolition of prices. It faded after the 1940s but influenced systems theory and cybernetics."}, "Ecologism": {"one": "Growth is not the goal; ecological carrying capacity is the binding constraint.", "figures": "Carson; deep ecology; the green parties", "tenets": ["Justice across generations and species", "Against unlimited growth", "Nature has intrinsic value, not merely resource value"], "misread": "That it equals environmental policy. It questions growth itself, not just pollution.", "read": "Carson, *Silent Spring*", "history": "Carson's *Silent Spring* (1962) exposed pesticides and is taken as the starting point. The Club of Rome's *Limits to Growth* (1972) argued that growth has physical bounds. Green parties formed in the 1970s, the German Greens (1980) most successfully. Theory split in two: shallow ecology (better environmental policy) and deep ecology (nature has intrinsic value; humans are one species among many — Naess, 1973). After the 1990s it entered mainstream politics, and was criticized for turning “from a movement into a department”."}, "Confucianism": {"one": "Moral cultivation rather than punishment; relational ethics rather than contract.", "figures": "Confucius; Mencius; Xunzi", "tenets": ["Ren and li — benevolence and ritual propriety", "Govern by virtue, like the pole star", "Ruler and minister, father and son, each in place"], "misread": "That Confucianism is a tool of despotism. In the classics, resisting a bad ruler on moral grounds is legitimate; Mencius even held that killing a tyrant is not regicide.", "read": "*Analects*; *Mencius*", "history": "After Confucius (551–479 BCE) the disciples split into eight schools; Mencius (human nature is good) and Xunzi (it is bad) are the two great branches. Under Emperor Wu of Han (134 BCE) Confucianism became state orthodoxy. Song-Ming neo-Confucianism (Zhu Xi, 1130–1200) absorbed Buddhism and Daoism and built a system of mind and nature. Ming-Qing examinations used Zhu Xi's commentaries as the standard. It declined as a whole in the 20th century; from the 1980s “New Confucians” (Mou Zongsan and Tu Weiming abroad, Jiang Qing on the mainland) have tried to revive it."}, "Legalism": {"one": "Human nature is self-interested. Rule by institutions, rewards and punishment, not by moral suasion.", "figures": "Han Fei; Shang Yang; Li Si", "tenets": ["Fa (written law), shu (technique of controlling officials), shi (position of power)", "Heavy punishment for light offences", "Against preaching benevolence"], "misread": "That Legalism means the rule of law. Its “law” is the ruler's instrument and does not bind the ruler himself.", "read": "*Han Feizi*", "history": "Shang Yang reformed Qin in the 4th century BCE; Han Fei (c. 280–233 BCE) systematized the school. It became the ideology of the unified Qin, but Qin's fall ruined its reputation, and from the Han onward the pattern was “Confucian on the outside, Legalist inside”. The 20th century reassessed it: Zhang Taiyan and Liang Qichao saw a proto-rule-of-law; the 1970s ran a campaign “evaluate Legalism, criticize Confucianism”; contemporary scholars read it more as an early theory of state capacity."}, "Islamism": {"one": "Islam is not only a faith but a complete social order.", "figures": "Qutb; Khomeini; the Muslim Brotherhood", "tenets": ["Rule by sharia", "Against secularization", "The umma before the nation-state"], "misread": "That it equals terrorism. It is a broad political movement, from moderate parties to extremist groups.", "read": "Writings on Islam and secularism (e.g. Arkoun, *Rethinking Islam*)", "history": "Hassan al-Banna founded the Muslim Brotherhood in 1928 — the organizational starting point. In the 1950s–60s Qutb wrote *Milestones* in prison, proposing the theory of *jahiliyya* (the state of ignorance) that armed radicals would later draw on. The 1979 Iranian revolution produced the first Islamic Republic. Since then it has split: moderates entered parliaments (Turkey's AKP, Tunisia's Ennahda), radicals took up arms (al-Qaeda, ISIS). Scholarship stresses that “political Islam” is an umbrella, not a single organization."}, "Feminism": {"one": "Gender is not a natural fate but a structure of power.", "figures": "Beauvoir; Judith Butler; bell hooks", "tenets": ["Examine power in both public and private spheres", "Bodily autonomy", "Intersectionality: gender crosses class and race"], "misread": "That it only asks for equality between men and women. Its deeper question is how the category “gender” itself is constructed.", "read": "Beauvoir, *The Second Sex*", "history": "Wollstonecraft's *A Vindication of the Rights of Woman* (1792) is the starting point; the Seneca Falls convention (1848) was the first organized gathering. The first wave (late 19th–early 20th c.) fought for the vote. The second wave (1960s–70s) drew its theory from Beauvoir's *The Second Sex* (1949) and coined “the personal is political”. The third wave (1990s) is represented by Butler's *Gender Trouble* (1990): gender is performance, not essence. Contemporary work includes intersectionality (Crenshaw, 1989) and a fourth wave on social media."}, "Lineage Self-governance": {"one": "The state should stay out; we run things by our ancestors' rules.", "figures": "Traditional rural lineages; the local self-government tradition", "tenets": ["Local matters handled locally", "Bound by blood and status", "The state takes only security and taxes"], "misread": "That it equals conservatism. It is closer to localism, and often indifferent to national cultural issues.", "read": "Fei Xiaotong, *From the Soil*", "history": "The basic form of traditional Chinese village society. Fei Xiaotong's *From the Soil* (1947) gave the classic description: “imperial power stops at the county”. Lineages kept ancestral halls, lineage land, lineage rules and a head; they ran schooling, relief and dispute mediation. After 1900 the state pushed down into the countryside and weakened them. From the 1980s some revived (genealogies rewritten, halls rebuilt). Scholars treat this as an indigenous resource for local self-government, and criticize its patriarchy and exclusiveness."}, "Privatism": {"one": "Politics is not my business; I'll live my own life well.", "figures": "None — it is a condition, not a system", "tenets": ["Personal life first", "No sacrifice for abstract collectives", "Indifference to public affairs"], "misread": "That this is “having no position”. It is itself a position, and the most numerous one in modern societies.", "read": "Putnam, *Bowling Alone* (on its consequences)", "history": "Not a theory but a condition. Tocqueville's *Democracy in America* in the 1830s first described how individualism withdraws people from public life. Putnam's *Bowling Alone* (2000) used data to show American social capital declining steadily after the 1960s. Inglehart's work on postmaterialism shows that once material security rises, some people turn to self-realization rather than collective action."}, "Political Cynicism": {"one": "All politics is interest and performance. Don't take it seriously.", "figures": "None — also a condition", "tenets": ["Trust no promise", "Participation is pointless", "Mockery instead of action"], "misread": "That cynicism is clear-sightedness. The difference from realism: realists still act; cynics have given up.", "read": "Sloterdijk, *Critique of Cynical Reason*", "history": "It descends from the ancient Cynics (Diogenes), but the modern meaning differs: not contempt for convention, but disbelief in any public promise. Research grew after the 1970s; Sloterdijk's *Critique of Cynical Reason* (1983) is the key work. Political science quantifies it as declining political trust. The difference from apathy: the apathetic never cared; the cynical cared and were disappointed."}, "Nihilism": {"one": "There are no objective values; every judgment is invented.", "figures": "Nietzsche (as diagnostician, not adherent); some postmodern thinkers", "tenets": ["Values are man-made", "No ultimate foundation", "Behind every order lies power"], "misread": "That nihilism equals pessimism. It can lead to despair, or to creating one's own values.", "read": "Nietzsche, *Thus Spoke Zarathustra*", "history": "Turgenev's *Fathers and Sons* (1862) first made “nihilist” a popular word. In the 1880s Nietzsche diagnosed European nihilism: the highest values devaluing themselves. Heidegger in the 1940s read it as the forgetting of Being. Postmodernism (Lyotard's “incredulity toward metanarratives”) is often seen as its continuation. The argument has always been whether nihilism is a disease or a liberation."}, "Animism": {"one": "Everything is animate; humans and nature form one web of relations.", "figures": "No single author — humanity's longest-lived worldview", "tenets": ["Ancestors and nature spirits take part in daily life", "Cyclical time; no concept of progress", "The tribe is the whole moral circle"], "misread": "That it is primitive superstition. It is a complete worldview, and “everything is animate” has been revived in contemporary ecological ethics.", "read": "Frazer, *The Golden Bough*", "history": "In anthropology it refers to the “animist” stage proposed by Tylor (*Primitive Culture*, 1871), later criticized as an evolutionary bias. Contemporary anthropology (Descola 2005; Viveiros de Castro) treats animism not as early superstition but as a different ontology: nature and culture are not separated, and animals are also “persons”. It has influenced ecological philosophy and multispecies ethnography."}, "Theocracy": {"one": "God's law is the law of the land; there is no such domain as “the secular”.", "figures": "The medieval papacy; Savonarola; the Taliban", "tenets": ["Revelation above reason", "Religious law is the constitution", "The ruler answers only to God"], "misread": "That it is merely church-state fusion. The core is: no source of legitimacy independent of God.", "read": "Augustine, *City of God*", "history": "A universal ancient form: Egyptian pharaohs, Babylonian temples, the judges of Israel. The medieval papacy was its fullest version (the Gregorian Reform of 1075 asserted papal authority over kings). It declined with secularization, and the 1979 Iranian revolution is its most important modern revival. The theoretical core: no legitimacy independent of God; law, morality and politics are one."}, "Daoism": {"one": "The best government governs least — let things complete themselves.", "figures": "Laozi; Zhuangzi", "tenets": ["Govern by non-action (wuwei)", "Against artificial contrivance", "The way of nature; humans should follow it"], "misread": "That Daoism means withdrawing from the world. It has a clear political claim: the smaller the government, the better; the more it intervenes, the worse.", "read": "*Daodejing*; *Zhuangzi*", "history": "Laozi (c. 6th century BCE) left the five thousand characters of the *Daodejing*; Zhuangzi (4th century BCE) developed “the equality of things” and “free wandering”. In the early Han the “Huang-Lao” administration (2nd century BCE) made it state ideology — quiet government, rest for the people. After Emperor Wu it yielded to Confucianism but survived as a complement. Today it is reread as a resource for spontaneous order (Hayek cited it) and as a root of ecological thought."}, "Mohism": {"one": "Impartial care for all + conformity to superiors + usefulness as the test of right.", "figures": "Mozi", "tenets": ["Care for one another, benefit one another", "Against aggressive war", "Promote the worthy, restrain expenditure"], "misread": "That Mohism is pacifism. It also teaches *shangtong* — subordinates obey superiors — and was organized like a military body.", "read": "*Mozi*", "history": "Mozi (c. 470–391 BCE) studied Confucianism and then rejected it. The school was tightly organized under a “Grand Master”, its members ready to die for the cause. It taught impartial care, opposition to aggressive war, promotion of the worthy, and frugality. In the Warring States it was as prominent as Confucianism (“the prominent learning”); it died out after Qin-Han for reasons still debated (too organizational? too demanding?). Moderns rediscovered it: Liang Qichao called it China's socialist forerunner; since the 2010s its optics and mechanics in the *Mojing* have drawn new attention."}, "Utilitarianism": {"one": "Judge right and wrong by consequences alone: does it maximize total happiness?", "figures": "Bentham; Mill; Singer", "tenets": ["The greatest happiness principle", "Consequentialism", "Every sentient being counts in the calculation"], "misread": "That it means selfishness. It demands you weigh others' happiness equally with your own — a very demanding requirement.", "read": "Mill, *Utilitarianism*", "history": "Bentham's *Introduction to the Principles of Morals and Legislation* (1789) set out the greatest happiness principle: right and wrong by consequences alone, every sentient being counting as one. A series of British legislative reforms in the 19th century (poor law, public health, criminal law) carried its imprint. Mill's *Utilitarianism* (1861) distinguished qualities of pleasure and added a liberty principle to protect minorities from majorities. In the 20th century it entered economics (welfare economics, cost-benefit analysis). Rawls attacked it in 1971 for sacrificing minorities to majority interest. Singer's *Animal Liberation* (1975) extended the moral circle to animals. Effective altruism is its direct descendant."}, "Social Darwinism": {"one": "Society is a struggle for survival; the weak being eliminated is a law of nature.", "figures": "Spencer; Sumner", "tenets": ["No interference with competition", "Against welfare", "Hierarchy is naturally formed"], "misread": "That it comes from evolutionary theory. Darwin himself opposed the analogy; it is a biological metaphor bolted onto society.", "read": "Hofstadter, *Social Darwinism in American Thought* (a critical history)", "history": "Spencer (1820–1903) proposed “social evolution” before Darwin's *Origin of Species*, and later was labelled with the term (which he did not accept). Sumner spread in America the idea that “the elimination of the unfit in free competition is natural”. It was enormously influential from the late 19th to the early 20th century, supplying “scientific” cover for colonialism, racial hierarchy and opposition to welfare. Its reputation collapsed after the 20th century, but “survival of the fittest” rhetoric persists in economic policy."}, "Hegelianism": {"one": "History is reason unfolding itself; the state is the highest form of ethical life.", "figures": "Hegel", "tenets": ["Dialectic", "Absolute spirit", "The state above civil society"], "misread": "That it equals conservatism. Hegel influenced Marx on the left and fascist state theory on the right.", "read": "Hegel, *Philosophy of Right*", "history": "Hegel (1770–1831): *Phenomenology of Spirit* (1807), *Philosophy of Right* (1821). The core is the dialectic: history is spirit unfolding itself, contradiction drives it forward, the state is the highest form of ethical life. In the 1830s the school split into a left (Feuerbach, Marx) and a right (conservative state philosophy). In the 20th century Kojève and Taylor reread him, influencing existentialism and communitarianism."}, "Nietzscheanism": {"one": "Morality as we have it is a yoke invented by the weak; one must create values oneself.", "figures": "Nietzsche (appropriated in every direction after his death)", "tenets": ["Will to power", "Master morality vs slave morality", "The overman"], "misread": "That Nietzsche equals Nazism. He explicitly opposed antisemitism and nationalism; his sister altered his manuscripts.", "read": "Nietzsche, *On the Genealogy of Morality*", "history": "Nietzsche (1844–1900): *Zarathustra* (1883), *Genealogy of Morality* (1887). Core concepts: master and slave morality, will to power, the overman. After his collapse in 1889 his sister Elisabeth edited his papers and collaborated with the Nazis, so he was long misread as a fascist forerunner — one of the most famous distortions in intellectual history. Existentialism and post-structuralism appropriated him repeatedly in the 20th century."}, "Gandhism": {"one": "Dissolve power through non-violent non-cooperation, rather than seize it.", "figures": "Gandhi", "tenets": ["Ahimsa — non-violence", "Non-cooperation", "Means are ends: no good outcome from a bad method"], "misread": "That it is weakness. It is active, organized confrontation that refuses violence.", "read": "*Gandhi: An Autobiography*", "history": "Gandhi (1869–1948) developed the method in South Africa (1893–1914); after returning to India he turned to nationwide non-cooperation following the Amritsar massacre of 1919. The Salt March of 1930 was the emblematic action. The theoretical core: means are ends — pure ends cannot be reached by impure means; *satyagraha* (“holding to truth”) is active confrontation, not passive endurance. It shaped Martin Luther King Jr. and Mandela's early campaigns."}, "Meritocracy": {"one": "Rule by tested ability and record — not by vote, and not by blood.", "figures": "Confucius (promote the worthy); the examination system; Lee Kuan Yew; Daniel Bell", "tenets": ["Select the worthy and capable; ability can be examined", "Performance before popularity; long-term interest before short-term votes", "Judge by conduct and record, not by birth or connections"], "misread": "That it is a fig leaf for dictatorship. The normative version requires an examinable selection process and checkable records — not rule by force and secret technique.", "read": "Daniel Bell, *The China Model*", "history": "China has the longest lineage: Confucius taught “select the worthy and capable” (*Book of Rites*); the Han used recommendation; the Sui-Tang examination system (from 605) ran for thirteen centuries, selecting officials by examination rather than birth. The West has Plato's philosopher-king. Britain's civil service examinations (1855) are widely acknowledged to have borrowed from the Chinese model. After 1959 Lee Kuan Yew's Singapore practised elite selection, high pay to prevent corruption, and administrative efficiency — the most complete modern case. The contemporary theoretical version is Daniel Bell's *The China Model* (2015): selection by ability and virtue, replacing or supplementing one-person-one-vote. The main criticism: who sets the standards, and how do you stop selectors from reproducing themselves as a closed caste?"}, "Liberal Conservatism": {"one": "Keep individual liberty, but keep order and tradition too — freedom is not licence.", "figures": "Burke (in part); Disraeli; Thatcher; the European People's Party (CDU, UMP)", "tenets": ["Individual liberty and property first, but bounded by morality and law", "Trust the market, but the state maintains order and a floor", "Change gradually; respect existing institutions"], "misread": "That it is “liberal plus conservative” fence-sitting. It has one firm principle: liberty must be carried by order, and unconstrained liberty destroys itself. Hence economic liberalism with social discipline.", "read": "Hugh Cecil, *Conservatism*", "history": "“Liberal Toryism” appeared inside the 19th-century British Tory party; Disraeli's One Nation conservatism brought the working class into the national concern against Liberal individualism. Thatcherism in the 20th century strengthened economic liberty, while continental liberal conservatism (CDU, UMP) stressed social cohesion and Christian tradition. Its fundamental difference from classical liberalism: it does not believe the market solves everything; the state must maintain a moral and institutional frame."}, "Nationalism": {"one": "The nation comes first; every other loyalty yields to it.", "figures": "Fichte; Mazzini; Sun Yat-sen (Three Principles); right-wing parties everywhere", "tenets": ["The nation is the only source of political legitimacy", "Cultural homogeneity before pluralism", "National interest as the sole measure abroad"], "misread": "That it is fascism. Nationalism has no leadership principle and no cult of violence; it can combine with democracy (Wilsonian self-determination) or socialism (Third World liberation).", "read": "Gellner, *Nations and Nationalism*", "history": "The French Revolution of 1789 turned “sovereignty of the people” into “sovereignty of the nation” — the starting point. Italian and German unification were the 19th-century peak. After WWI Wilson's self-determination made it an international principle. Discredited by Nazism after WWII, it returned repeatedly: anti-colonial movements in Asia and Africa in the 1960s, the breakup of Eastern Europe in the 1990s, the rise of the right in Europe and America in the 2010s."}, "Anarcho-syndicalism": {"one": "No party, no state — workers run production directly through their unions.", "figures": "Sorel; the Spanish CNT-FAI; the early French CGT", "tenets": ["The union, not the party, is the subject of revolution", "The general strike as the main weapon", "Factory committees manage production directly"], "misread": "That it is trade unionism. It wants to abolish the state, not bargain for a better contract.", "read": "Sorel, *Reflections on Violence*", "history": "The French CGT was founded in 1895 and adopted “direct action”. In the 1900s it spread to Spain, Italy and the United States (the IWW). The Spanish Civil War of 1936 was its only large-scale practice — the CNT organized the self-management of millions of workers. It declined after Franco crushed it in 1939."}, "Paternalistic Conservatism": {"one": "Those above have a duty to care for those below — and those below must accept supervision.", "figures": "Disraeli; Bismarck; Leo XIII's *Rerum Novarum*", "tenets": ["Society is an organism, not a contract", "Elites owe a duty of care to the weak", "The state provides welfare and also sets moral standards"], "misread": "That it is authoritarianism. It does supervise, but the core is care: welfare in exchange for deference, not force alone.", "read": "Hugh Cecil, *Conservatism*", "history": "Disraeli's One Nation conservatism in 19th-century Britain held that the Tory party owed a duty to the working class. Bismarck meanwhile built the world's first old-age and health insurance in Germany — in order to weaken socialism. Leo XIII's *Rerum Novarum* (1891) founded Catholic social teaching. Some conservative parties in Scandinavia and Latin America carried the tradition into the 20th century."}, "Deep Ecology": {"one": "Nature has intrinsic value, not merely resource value; humans are one strand in the web.", "figures": "Naess; Sessions; *The Ecologist*", "tenets": ["All life has equal intrinsic value", "Population and consumption must fall", "Against a growth economy"], "misread": "That it is environmentalism. Environmentalism protects resources for humans; deep ecology holds that nature is an end in itself.", "read": "Naess, *Ecology, Community and Lifestyle*", "history": "Naess coined “deep ecology” in 1973, distinguishing shallow ecology (technical fixes) from deep ecology (fundamental change). Sessions set out an eight-point platform in 1985. It influenced radical movements such as Earth First! and ecofeminism."}, "Transhumanism": {"one": "Humans should remake themselves with technology — body and intellect alike.", "figures": "Julian Huxley; FM-2030; Nick Bostrom", "tenets": ["Aging is a solvable technical problem", "Cognitive enhancement as a right", "The human form is not fixed"], "misread": "That it is science fiction. It has a concrete ethical and political programme — funding longevity research, legalizing gene editing.", "read": "Bostrom, *Transhumanism* (and *Superintelligence*)", "history": "Julian Huxley first used “transhumanism” in 1957. In the 1980s Ettinger and FM-2030 promoted cryonics and the “upwingers” movement. The World Transhumanist Association was founded in 1998. Since the 2000s it has merged with effective altruism and longtermism, with many adherents in Silicon Valley."}, "Liberation Theology": {"one": "God takes the side of the poor; faith must become social action.", "figures": "Gutiérrez; Archbishop Romero; Bonhoeffer (in part)", "tenets": ["Structural poverty is sin", "The church must stand with the poor", "Liberation is part of faith, not only the afterlife"], "misread": "That it is religious charity. It demands changing the institutions that produce poverty, not just relieving it.", "read": "Gutiérrez, *A Theology of Liberation*", "history": "Base communities appeared in Latin America in the 1960s. Gutiérrez's *A Theology of Liberation* was published in 1971. The 1979 Latin American bishops' conference at Puebla endorsed the line. In Nicaragua priests served directly in the revolutionary government. The Vatican criticized it repeatedly in the 1980s; under Pope Francis the stance shifted toward acceptance."}, "Left Authoritarianism": {"one": "Economic equality without political liberty.", "figures": "Stalin; Hoxha; some Third World military governments", "tenets": ["State ownership plus one-party rule", "Equality before liberty", "Ideological uniformity"], "misread": "That it is Marxism. Marx himself was committed to political freedoms (a free press, universal suffrage); left authoritarianism is the version that dropped them.", "read": "Bell, *The End of Ideology* (relevant chapters)", "history": "After 1917 Soviet Russia progressively eliminated opposition parties and press freedom; Kronstadt in 1921 was the turning point. It hardened under Stalin and was copied across Eastern Europe after WWII. Cambodia under the Khmer Rouge in the 1970s was the most extreme version. Its difference from “Marxist revolution” lies in the visibility of power and the mechanism of appointment."}, "Postcolonialism": {"one": "Colonialism did not end with independence; it continues in culture and economics.", "figures": "Said; Spivak; Bhabha; Fanon", "tenets": ["Knowledge production itself carries colonial structures", "“Universality” is often Western particularity in disguise", "The colonized must reclaim the right to narrate"], "misread": "That it is historical research. It is a critique of the contemporary international order and knowledge system.", "read": "Said, *Orientalism*", "history": "Fanon's *Black Skin, White Masks* (1952). Said's *Orientalism* (1978) established that “the Orient is not a geography but a Western construction”. In the 1980s Spivak and Bhabha brought in deconstruction. It intersects with Marxism and feminism, feeding theories of intersectionality."}, "Neoconservatism": {"one": "Liberal democracy needs a strong state to defend it abroad, and moral discipline at home.", "figures": "Irving Kristol; Norman Podhoretz; Paul Wolfowitz", "tenets": ["American values are universal and should be actively promoted", "The welfare state corrodes personal responsibility", "Firmness abroad is the precondition of peace"], "misread": "That it equals traditional conservatism. Traditional conservatives oppose foreign intervention; neoconservatives are precisely the interventionists.", "read": "*The Neoconservative Reader*", "history": "In the 1960s–70s a group of former left-wing intellectuals (Kristol, Bell) turned right; the current took shape in the 1970s. The Reagan administration in the 1980s and the Bush administration in the 2000s (the Iraq War) were its high points. Its difference from liberal conservatism lies in foreign policy: value projection and military intervention."}, "Left-wing Nationalism": {"one": "National liberation and socialism are one thing — anti-imperialism with social equality.", "figures": "Mazzini (in part); Nehru; Sukarno; Nasser; Perón", "tenets": ["Anti-imperialism and anti-capitalism are one front", "The state leads industrialization", "National independence before individual liberty"], "misread": "That it is simply “left plus patriotic”. It has its own logic: in backward countries class liberation must pass through national liberation, so independence is the precondition of socialism.", "read": "Anderson, *Imagined Communities*", "history": "Mazzini in 19th-century Italy joined national liberation to republican ideals. The 20th-century peak was anti-colonialism across Asia, Africa and Latin America: Nehru's Congress socialism, Sukarno's Nasakom, Nasser's Arab socialism, Nkrumah's African socialism. Peronism in Latin America is another branch. It declined with the Non-Aligned Movement after the 1970s but remains influential in Latin America (Chávez) and South Asia."}, "Neoliberalism": {"one": "The market allocates best; the state's job is to protect the market, not replace it.", "figures": "Hayek; Friedman; Thatcher; Reagan", "tenets": ["Privatization and deregulation", "Fiscal discipline and low taxes", "Free movement of trade and capital"], "misread": "That it is a “new liberalism”. The Chinese term has two sources that point opposite ways: (1) Britain's *new liberalism* at the end of the 19th century (Green, Hobhouse) — state intervention to realize freedom, which this library calls social liberalism; (2) 20th-century *neoliberalism* (Hayek, Friedman) — market fundamentalism. They are not the same thing.", "read": "Hayek, *The Road to Serfdom*; Friedman, *Capitalism and Freedom*", "history": "The term was first used at the 1938 Lippmann Colloquium in Paris. The Mont Pelerin Society was founded in 1947. When Keynesianism failed against stagflation in the 1970s, it got its opening. Thatcher (1979) and Reagan (1980) were the turning point. The 1989 Washington Consensus made it a loan condition of international financial institutions. It was badly damaged by the 1999 Seattle protests and the 2008 crisis, but the framework survives."}, "Ordoliberalism": {"one": "Free competition, but the rules of competition must be set and enforced by a strong state.", "figures": "Eucken; Erhard; Röpke; the Freiburg School", "tenets": ["The state does not set prices, but must enforce competition", "Monetary stability is the state's first duty", "The market order needs a legal frame maintained over time"], "misread": "That it is neoliberalism. Neoliberalism thinks the market solves most problems by itself; ordoliberalism holds that the market order itself must be continuously maintained by the state — no referee, no match.", "read": "Eucken, *Principles of Economic Policy*", "history": "The Freiburg School formed in the 1930s (Eucken, Röpke). After WWII Erhard implemented the “social market economy” in Germany; the 1957 Act against Restraints of Competition was the landmark. Its difference from Anglo-American neoliberalism: more antitrust, more acceptance of social insurance, a stronger emphasis on the state as neutral referee. Interest in it revived in Europe after 2008."}, "Progressivism": {"one": "Society should actively move forward, using policy and institutions to fix inequality.", "figures": "Dewey; the American Progressive Party; the New Deal; Nordic social democracy", "tenets": ["Government is the instrument of reform, not the problem", "Science and expertise should serve governance", "Rights should extend into new domains — social, environmental"], "misread": "That it is the radical left. Progressivism believes in reform inside the system, not overthrow; but it wants change faster than social liberalism does.", "read": "Dewey, *Democracy and Education*", "history": "The American Progressive Era (1890–1920): antitrust, women's suffrage, food and drug legislation. The New Deal in the 1930s. The civil rights movement in the 1960s. Its difference from social liberalism is mainly posture: social liberalism defends the welfare institutions already won; progressivism keeps pushing new issues."}, "Socialism with Chinese Characteristics": {"one": "Party leadership, public ownership as the mainstay, a market economy, and common prosperity — all four at once.", "figures": "Deng Xiaoping; Jiang Zemin; Hu Jintao; Xi Jinping", "tenets": ["Leadership by the Communist Party of China is the defining feature of socialism with Chinese characteristics", "Public ownership as the mainstay, developing together with other forms of ownership", "The market plays a decisive role in allocating resources; the government plays its role better", "Common prosperity is an essential requirement of socialism", "Reform is the self-improvement of the socialist system, not a change of flag"], "misread": "That it is another name for state capitalism or authoritarianism. Its own formulation is “people-centred”, and it explicitly rejects treating the market as an end. Nor is it a planned economy — it writes the market into socialism rather than choosing between the two.", "read": "The Constitution of the PRC (Preamble and General Principles); the Constitution of the CPC (General Programme); Xi Jinping's speech at the centenary of the Party (2021)", "history": "The Third Plenum of 1978 shifted from class struggle to economic construction. The 12th Congress (1982) proposed “building socialism with Chinese characteristics”. The 14th Congress (1992) established the socialist market economy. The 15th (1997) wrote Deng Xiaoping Theory into the Party constitution. The 16th (2002) introduced the Three Represents. The 17th (2007) the Scientific Outlook on Development. The 19th (2017) Xi Jinping Thought. In 2021 the Party declared a moderately prosperous society in all respects."}, "Left-Wing Populism": {"one": "The people against the elites — plus state control of the economy.", "figures": "Chávez; Morales; Tsipras; Iglesias", "tenets": ["Society splits into “the ordinary people” and “the corrupt elite”", "Elites — politicians, bankers, media — have stolen what belongs to the people", "Let the people rule directly, bypassing intermediary institutions", "Nationalize, redistribute, resist austerity"], "misread": "That it is socialism. It is more anti-establishment than socialism: it distrusts union bureaucracies and parliamentary procedure, trusting only “the people” as a whole. Nor does it require changing relations of production — only taking “the people's money” back.", "read": "Mudde & Kaltwasser, *Populism: A Very Short Introduction*; Laclau, *On Populist Reason*", "history": "The Russian Narodniks of the 19th century first used the word, hoping to skip capitalism and go straight to village socialism. Perón and Vargas in 20th-century Latin America were early forms. Chávez's election in 1998 is the contemporary starting point. In the 2010s Syriza in Greece and Podemos in Spain brought it into Europe. The 2016 campaigns of Sanders and Corbyn were called a “left-populist moment”."}, "Right-Wing Populism": {"one": "The people against the elites — plus “this country has been taken over by outsiders”.", "figures": "Trump; Le Pen; Orbán; Farage", "tenets": ["The people against the elite — including politicians, media and experts", "The nation-state is the only legitimate political unit; supranational bodies usurp power", "Immigration and cultural pluralism threaten “our people”", "Welfare should go to citizens only"], "misread": "That it is conservatism. It is anti-establishment and hostile to existing elites, whereas conservatism respects established authority. Nor is it fascism: it does not want to abolish elections — it demands elections that “really represent the people”.", "read": "Mudde, *Populism*; Judis, *The Populist Explosion*; Müller, *What Is Populism?*", "history": "The French National Front (1972) is the contemporary prototype. The Austrian Freedom Party and the Swiss People's Party rose in the 1990s. Nordic right populism (Danish People's Party, Sweden Democrats) matured in the 2000s. Trump's election and Brexit in 2016 were the peak. In the 2010s Orbán and Kaczyński turned it into a governing force."}, "Leninism": {"one": "A disciplined vanguard party leads the proletariat to seize power.", "figures": "Lenin; Trotsky (early); the Comintern", "tenets": ["Workers do not spontaneously become revolutionary; the vanguard must bring consciousness from outside", "Imperialism is the highest stage of capitalism; war is unavoidable", "Revolution can triumph first in one or a few countries", "Dictatorship of the proletariat; all power to the soviets", "Democratic centralism as the party's organizational principle"], "misread": "That it is Marxism. It is Marxism reworked for Russian conditions: Marx waited for capitalism to mature; Lenin held that a backward Russia could go first. Nor does it equal one-party dictatorship — factions still argued inside the party in Lenin's time.", "read": "Lenin, *What Is to Be Done?*; *The State and Revolution*; *Imperialism, the Highest Stage of Capitalism*", "history": "*What Is to Be Done?* (1902) set out the vanguard theory. In 1903 the Russian Social Democratic Labour Party split into Bolsheviks and Mensheviks. *On the Slogan for a United States of Europe* (1915) raised “victory in one country first”. October 1917. The Comintern was founded in 1919. After Lenin's death in 1924, factional struggle began."}, "Stalinism": {"one": "Socialism in one country, built by plan and bureaucratic machine, catching up by force.", "figures": "Stalin; Zhdanov; the Soviet model", "tenets": ["Socialism can be built in one country; no need to wait for world revolution", "Heavy industry first; collectivize agriculture", "Command planning through five-year plans", "Class struggle intensifies under socialism", "One-party leadership; democratic centralism tilts to centralism"], "misread": "That it is the natural continuation of Leninism. Trotskyists regard it as a betrayal. Nor is it merely dictatorship — it was a complete programme of forced industrialization that made the USSR an industrial power in the 1930s.", "read": "Stalin, *Dialectical and Historical Materialism*; *Economic Problems of Socialism in the USSR*; Cohen, *Bukharin and the Bolshevik Revolution* (read alongside)", "history": "After Lenin's death in 1924 Stalin fought successively with Trotsky, Zinoviev and Bukharin. The first five-year plan and collectivization in 1928. The 1936 constitution. The Great Purge of 1936–38. By 1945 the USSR was a superpower. Khrushchev's secret report of 1956 denounced Stalin."}, "Eurocommunism": {"one": "The parliamentary road, abandoning the dictatorship of the proletariat.", "figures": "Berlinguer (PCI); Carrillo (PCE); Marchais (PCF)", "tenets": ["Win power through elections inside democracy, not by violent revolution", "Drop the dictatorship of the proletariat; respect multiparty politics", "The party is a mass party, not a vanguard", "Against Soviet leadership; each country takes its own road"], "misread": "That it is social democracy. It still called itself communist and aimed beyond capitalism, only without dictatorship. Nor is it reformism — it wanted to change ownership, not just adjust distribution.", "read": "Berlinguer, *The Idea of Eurocommunism*; Carrillo, *Eurocommunism and the State*", "history": "In the 1970s Western European communist parties gained votes but refused full Soviet alignment. The Italian and Spanish parties issued a joint declaration in 1975. At the Madrid summit of 1977 the Italian, Spanish and French parties defined “Eurocommunism”. It declined after the 1980s; the PCI became the Democrats of the Left in 1991."}, "Titoism": {"one": "Workers' self-management, market socialism, non-alignment.", "figures": "Tito; Kardelj; the League of Communists of Yugoslavia", "tenets": ["Factories run by workers' councils, not by the state", "Keep market mechanisms but limit capital", "No Soviet bloc; a non-aligned course", "Federalism with autonomy for each nation"], "misread": "That it is another Soviet model. It was precisely the opponent of the Soviet model — Stalin expelled Yugoslavia from the Cominform in 1948. Nor is it a market economy: it opposed privatization, objecting only to state ownership.", "read": "Kardelj, *Self-Management and the Socialist System*; the journal *Praxis*", "history": "Yugoslavia broke with the USSR in 1948 and was expelled from the Cominform. Workers' self-management began in 1950. In 1955, with India and Egypt, it launched the Non-Aligned Movement. Tito died in 1980 and the federation loosened. Yugoslavia dissolved in the 1990s."}, "Classical Marxism": {"one": "Class, exploitation, historical necessity — and revolution as the proletariat's own work.", "figures": "Marx; Engels; Rosa Luxemburg (early)", "tenets": ["The history of all hitherto existing society is the history of class struggles", "Capitalists appropriate surplus value: exploitation is structural, not the greed of bad men", "The economic base determines the superstructure; ideas do not drive history", "The proletariat can only be liberated by itself", "Communism is not a designed blueprint but the unfolding of historical contradictions", "Workers of the world, unite — capital has no homeland, and labour should have none either"], "misread": "That it is Leninism. Marx proposed no vanguard party and never said revolution could win first in one country — that was Lenin's adaptation to Russian conditions. Nor does it mean abolishing all private property: Marx distinguished means of consumption from means of production.", "read": "*The Communist Manifesto*; *Economic and Philosophic Manuscripts of 1844*; *Capital* vol. 1; Engels, *Socialism: Utopian and Scientific*", "history": "*The Communist Manifesto* (1848). The First International in 1864, dissolved in 1872 after the split with the Bakuninists. *Capital* vol. 1 in 1867. The Paris Commune of 1871, which produced *The Civil War in France*. Marx died in 1883; Engels edited the papers. After the Second International, Marxism split into a reformist (Bernstein) and a revolutionary (Lenin) branch."}, "Dataism": {"one": "The universe consists of data flows; all value lies in contribution to data processing.", "figures": "Harari; platform capitalism; recommendation algorithms", "tenets": ["Every phenomenon and entity can be reduced to a data flow", "The value of a thing equals its contribution to data processing", "Feelings and free will are outputs of biochemical algorithms", "Datafication is irreversible; people will hand over decision-making willingly"], "misread": "That it means valuing data. It is an ontology — data is taken to be more real than experience. Nor is it technocracy: technocracy puts experts in charge; dataism lets data speak, with experts merely one link in the processing chain.", "read": "Harari, *Homo Deus* (last three chapters); Zuboff, *The Age of Surveillance Capitalism*", "history": "David Brooks first used the term in the *New York Times* in 2013; Harari's *Homo Deus* (2016) made it current. Intellectually it descends from cybernetics (Wiener) and information theory (Shannon). In the 2010s the platform economy turned the metaphor into fact: recommendation algorithms, credit scoring, predictive policing."}, "Algocracy": {"one": "Hand public decisions to algorithms; humans set the goals.", "figures": "Chile's Cybersyn; Estonia's e-government; city brains", "tenets": ["Human judgment is biased, tires and can be bought; algorithms are none of these", "Authority derives from verifiable correctness, not from election or appointment", "Humans set objectives; algorithms execute", "Decision processes should be auditable and reproducible"], "misread": "That it means computerizing the office. It proposes a transfer of decision rights, not a tool upgrade. Nor is it technocracy: technocracy puts experts in charge; algorithmic governance removes people from decisions, leaving experts to maintain the algorithms.", "read": "Aneesh, *The Global Rise of the Modern Algorithmic State*; Danaher et al., *Algorithmic Governance*", "history": "Chile's Cybersyn project (Stafford Beer) in the 1960s was the precursor. E-government in the 1990s. In the 2010s algorithms entered public decisions: predictive policing (PredPol), Australia's Robodebt welfare recovery, China's city brains. After Cambridge Analytica in 2018, “algorithmic accountability” became a public issue."}, "World Federalism": {"one": "Sovereignty should be partly delegated to a federal world government with limited powers.", "figures": "Dante; Kant; H. G. Wells; the World Federalist Movement", "tenets": ["War comes from international anarchy; only a legal order above states can end it", "A world government's functions are limited: security, environment, transnational justice — the rest stays with states", "It must arise from democratic procedure, not a concert of great powers", "Sovereignty is not absolute; it can be divided and delegated"], "misread": "That it is “world harmony” or a globalist conspiracy. It wants a limited federal government, not a single world state, and explicitly rejects rule by the five permanent members. Nor should it be confused with international organizations — the UN has no direct taxing power and no enforcement capacity; it is only a partial realization.", "read": "Kant, *Perpetual Peace* (1795); Dante, *De Monarchia* (1310); the Montreux Declaration of the World Federalist Movement", "history": "Dante's *De Monarchia* (1310) first argued systematically for a universal empire. Kant proposed a federation of free states in 1795. The Hague Peace Conference of 1910. The Atlantic Union movement of 1938. United World Federalists was founded in 1947. After the 1990s it turned to concrete mechanisms: the International Criminal Court (1998), climate agreements. The EU is the closest living example — supranational institutions with member states retaining most sovereignty."}}, "layers": {"Political stance": [2, 7, 8, 9, 10, 11, 12, 13, 22, 23, 24], "Method": [4, 6, 14, 15, 19, 20], "Worldview": [1, 3, 5, 16, 17, 18, 21]}, "dimInfo": {"0": {"q": "What ultimately makes a rule or an authority count?", "lo": "Rules are things people agree on. State the reason and it stands; lose the reason and it changes. No rule is beyond the question “why”.", "hi": "Some rules need no reason. Behind them stand God, a cosmic order, the laws of history or of nature. We can only go along."}, "1": {"q": "What is the basic unit of society?", "lo": "A person is nothing apart from the community. Language, meaning, capacity — all of it is given by society.", "hi": "Society is only the sum of individuals. The individual is the final bearer of rights and meaning."}, "2": {"q": "What drives history?", "lo": "Key decisions, a leader's will, human choice. A different decision and the outcome is different.", "hi": "Technology, demography, geography — once the trend arrives it happens. People ride it or react to it."}, "3": {"q": "Can institutions be designed in advance?", "lo": "Yes. Design it well enough and it runs as designed.", "hi": "No. Good institutions accumulate through trial and error. The more you design, the worse it gets."}, "4": {"q": "What is human nature like?", "lo": "Humans are born good, or can be made good by education and environment.", "hi": "Self-interest and limitation are constant. Only institutions constrain them; they cannot be cured."}, "5": {"q": "Why do you believe a claim?", "lo": "It accords with the direction of development and will arrive. That is why it is worth believing.", "hi": "It is right in principle. Even if it is never realized, it should be pursued."}, "6": {"q": "Who should allocate the economy?", "lo": "The government sets targets, issues permits, controls prices — allocation by administrative means.", "hi": "Prices and competition find their own level. The government keeps its hands off."}, "7": {"q": "How much should social conduct be regulated?", "lo": "Community, behaviour, speech all need rules. Without management it falls apart.", "hi": "The less management the better. People can judge for themselves; not everything needs a rule."}, "8": {"q": "Should power be concentrated or dispersed?", "lo": "Unified planning and uniform rules, or it spins out of control.", "hi": "Local conditions vary enormously; local decision is the only reasonable one."}, "9": {"q": "Who owns the organizations between state and individual?", "lo": "Administrative bodies act on their behalf — residents' committees, higher-level agencies.", "hi": "Self-governing groups organize themselves — owners' associations, cooperatives, trade bodies."}, "10": {"q": "What makes a person qualified to hold authority?", "lo": "A proper source of authority. If the procedure is wrong, good results do not make it legitimate.", "hi": "Doing the job well is the qualification. Results are the hardest evidence."}, "11": {"q": "Where does a leader's power come from?", "lo": "Appointment from above, or promotion by ability. No need for a vote by the governed.", "hi": "A vote by the governed. Only election confers legitimacy."}, "12": {"q": "Should the status quo be changed?", "lo": "It is fine as it is. Stability is itself a value; no need to stir things up.", "hi": "Standing still is falling behind. If it needs changing, change it."}, "13": {"q": "If change is needed, how?", "lo": "Pilot first, roll out gradually, leave room to reverse.", "hi": "Tear it down and rebuild in one go. Better one sharp pain than a drawn-out ache."}, "14": {"q": "Who drives change?", "lo": "Capable people initiate and lead. The majority follows.", "hi": "Change only holds if the majority takes part. Without a popular base it collapses."}, "15": {"q": "What holds people together?", "lo": "Blood, locality, connections, face. With the right people, anything works.", "hi": "Contracts, rules, legal procedure. Clear rules are what protect relationships."}, "16": {"q": "How far does your moral obligation reach?", "lo": "Closer means heavier. The distant is out of reach, and not an individual's burden.", "hi": "All are human, the duty is the same. Distance does not change obligation."}, "17": {"q": "Is technology a neutral tool, or does it carry its own bias?", "lo": "Guns don't kill people; people do. What matters is who uses it and how.", "hi": "Some technologies' design locks in a power structure; once in use it cannot be undone."}, "18": {"q": "How should we handle something new with uncertain consequences?", "lo": "Prove it harmless before allowing it to spread. Some mistakes cannot be made.", "hi": "Allow it first, regulate when problems appear. Without risk nothing gets done."}, "19": {"q": "How do you work with others?", "lo": "Bring in everyone you can, even those who disagree. Shrink the enemy to the minimum.", "hi": "Cooperate with whoever shares an interest; no long-term loyalty. Or simply do it alone."}, "20": {"q": "If a higher order exists, what is it?", "lo": "A being with a will — one that arranges, responds, judges.", "hi": "Objective law — purposeless, and deaf to prayer."}, "21": {"q": "How many people should know how decisions are made?", "lo": "Efficiency first. Not everything needs to be laid open; a result is enough.", "hi": "The process must be inspectable and open to challenge. What cannot be seen cannot be corrected."}, "22": {"q": "Should power rest in one centre or in several?", "lo": "There must be one place that makes the final call. Multiple centres means friction and no one accountable.", "hi": "Power must be dispersed and mutually checked. A single centre rots eventually, even if it starts well."}, "23": {"q": "What is the unit of change?", "lo": "Many problems can only be solved across borders. Walling yourself inside a nation is self-deception.", "hi": "Put your own house in order first. Other countries' affairs are not ours to decide."}}, "dimEn": {"1": "Conventionalism / Transcendent Order", "2": "Collectivism / Individualism", "3": "Voluntarism / Determinism", "4": "Constructivism / Spontaneous Order", "5": "Human Perfectibility / Original Sin", "6": "Historicism / Normativism", "7": "Interventionism / Laissez-Faire", "8": "Paternalism / Liberty", "9": "Centralization / Decentralization", "10": "Corporatism / Pluralism", "11": "Proceduralism / Consequentialism", "12": "Appointment / Electoral Accountability", "13": "Status Quo / Reform", "14": "Reformism / Revolutionism", "15": "Vanguardism / Spontaneism", "16": "Gemeinschaft / Gesellschaft", "17": "Particularism / Universalism", "18": "Instrumentalism / Substantivism", "19": "Precautionary / Proactionary", "20": "Coalition-building / Transactionalism", "21": "Personal God / Impersonal Order", "22": "Arcana Imperii / Publicity", "23": "Unitary / Pluralist", "24": "Internationalism / Nationalism"}, "anchorEn": {"Anarcho-communism": "Anarcho-communism", "Anarcho-individualism": "Anarcho-individualism", "Maoism": "Maoism", "Social Democracy": "Social Democracy", "Social Liberalism": "Social Liberalism", "Religious Socialism": "Religious Socialism", "Liberalism": "Liberalism", "Libertarianism": "Libertarianism", "Conservatism": "Conservatism", "Communitarianism": "Communitarianism", "Authoritarian Fascism": "Authoritarian Fascism", "State Capitalism": "State Capitalism", "Technocracy Movement": "Technocracy Movement", "Ecologism": "Ecologism", "Confucianism": "Confuc
